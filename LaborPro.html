PG.attendance=function(){const ym=U.ms().slice(0,7);const lb=D.g('labors').filter(l=>l.status==='Active');return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-calendar-check mr-2" style="color:var(--accent)"></i>Attendance</h1><p class="text-xs" style="color:var(--text2)">${lb.length} active labors</p></div><div class="flex gap-2 no-print flex-wrap"><input class="inp" type="month" id="att_ym" value="${ym}" onchange="renderAtt()" style="font-size:11.5px;width:160px"><button class="btn btn-info" onclick="markAllPresent()" title="Mark All Present Today"><i class="fas fa-check-double"></i> All Present</button><button class="btn btn-s" onclick="expAtt()"><i class="fas fa-download"></i></button></div></div><div class="flex gap-3 mb-4 text-xs flex-wrap"><span class="flex items-center gap-1"><span class="w-5 h-5 rounded flex items-center justify-center text-xs font-bold att-P">P</span> Present</span><span class="flex items-center gap-1"><span class="w-5 h-5 rounded flex items-center justify-center text-xs font-bold att-A">A</span> Absent</span><span class="flex items-center gap-1"><span class="w-5 h-5 rounded flex items-center justify-center text-xs font-bold att-H">H</span> Half Day</span><span class="flex items-center gap-1"><span class="w-5 h-5 rounded flex items-center justify-center text-xs font-bold att-L">L</span> Leave</span><span class="flex items-center gap-1"><span class="w-5 h-5 rounded flex items-center justify-center text-xs att-empty">-</span> Not Marked</span></div><div id="att_container"></div>`};
PG.attendanceI=function(){renderAtt()};
window.renderAtt=function(){const ym=document.getElementById('att_ym')?.value||U.ms().slice(0,7);const lb=D.g('labors').filter(l=>l.status==='Active');const att=D.g('attendance');const daysInMonth=U.daysInMonth(ym+'-01');const dayNames=['S','M','T','W','T','F','S'];const today=U.td();const wknds=D.go('adminConfig').weekendDays||[5];let tbl=`<div class="tw" style="min-width:${120+daysInMonth*42}px"><table style="font-size:11px"><thead><tr><th style="min-width:120px;position:sticky;left:0;background:var(--card2);z-index:2">Labor</th>`;for(let d=1;d<=daysInMonth;d++){const dt=ym+'-'+String(d).padStart(2,'0');const dow=new Date(dt).getDay();const isW=wknds.includes(dow);const isF=dt>today;tbl+=`<th style="min-width:38px;padding:4px 2px;text-align:center;${isW?'color:var(--error);':''}${isF?'opacity:.3;':''}">${d}<br><span style="font-size:8px">${dayNames[dow]}</span></th>`}tbl+='</tr></thead><tbody>';lb.forEach(l=>{tbl+=`<tr><td class="font-semibold" style="position:sticky;left:0;background:var(--card);z-index:1;min-width:120px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.name}">${l.name}</td>`;for(let d=1;d<=daysInMonth;d++){const dt=ym+'-'+String(d).padStart(2,'0');const dow=new Date(dt).getDay();const isW=wknds.includes(dow);const isF=dt>today;const rec=att.find(a=>a.lid===l.id&&a.date===dt);if(isW){tbl+=`<td class="text-center" style="padding:3px 2px;background:rgba(139,93,246,.06);color:var(--text2);opacity:.5">W</td>`}else if(isF){tbl+=`<td class="text-center" style="padding:3px 2px;opacity:.3">-</td>`}else if(rec){const cls=rec.status==='P'?'background:rgba(16,185,129,.15);color:var(--success);font-weight:700':rec.status==='A'?'background:rgba(239,68,68,.15);color:var(--error);font-weight:700':rec.status==='H'?'background:rgba(245,158,11,.15);color:var(--accent);font-weight:700':'background:rgba(6,182,212,.15);color:var(--info);font-weight:700';tbl+=`<td class="text-center" style="padding:3px 2px;${cls};cursor:pointer;border-radius:4px" onclick="togAtt(${l.id},'${dt}')" title="Click to change">${rec.status}</td>`}else{tbl+=`<td class="text-center" style="padding:3px 2px;cursor:pointer;opacity:.4" onclick="togAtt(${l.id},'${dt}')" title="Click to mark">-</td>`}}tbl+='</tr>'});tbl+=`<tr style="border-top:2px solid var(--border)"><td class="font-bold" style="position:sticky;left:0;background:var(--card2);z-index:1;color:var(--accent);min-width:120px">Present</td>`;for(let d=1;d<=daysInMonth;d++){const dt=ym+'-'+String(d).padStart(2,'0');const dow=new Date(dt).getDay();const isW=wknds.includes(dow);const isF=dt>today;if(isW){tbl+=`<td class="text-center" style="padding:3px 2px;opacity:.3">-</td>`}else if(isF){tbl+=`<td class="text-center" style="padding:3px 2px;opacity:.3">-</td>`}else{const p=att.filter(a=>a.date===dt&&a.status==='P').length;const pct=lb.length?p/lb.length:0;const c=pct>=0.8?'var(--success)':pct>=0.5?'var(--accent)':'var(--error)';tbl+=`<td class="text-center font-bold" style="padding:3px 2px;color:${c};font-size:10px">${p}</td>`}}tbl+='</tr></tbody></table></div>';document.getElementById('att_container').innerHTML=tbl};
window.togAtt=function(lid,date){const att=D.g('attendance');const idx=att.findIndex(a=>a.lid===lid&&a.date===date);const cycle=['P','A','H','L'];if(idx>-1){const cur=att[idx].status;const ni=cycle.indexOf(cur);if(ni===cycle.length-1){att.splice(idx,1)}else{att[idx].status=cycle[ni+1]}}else{att.push({id:D.ni('attendance'),date,lid,status:'P',notes:'',ct:new Date().toISOString()})}D.s('attendance',att);renderAtt()};
window.markAllPresent=function(){const today=U.td(),lb=D.g('labors').filter(l=>l.status==='Active'),att=D.g('attendance');let added=0;lb.forEach(l=>{if(!att.find(a=>a.lid===l.id&&a.date===today)){att.push({id:D.ni('attendance'),date:today,lid:l.id,status:'P',notes:'',ct:new Date().toISOString()});added++}else{const rec=att.find(a=>a.lid===l.id&&a.date===today);if(rec.status!=='P'){rec.status='P';added++}}});D.s('attendance',att);AU.log('Mark All Present',added+' marked');N.s(added+' labors marked present');renderAtt()};
window.expAtt=function(){const ym=document.getElementById('att_ym')?.value||U.ms().slice(0,7);const att=D.g('attendance').filter(a=>a.date.startsWith(ym+'-'));if(!att.length){N.w('No attendance data');return}const daysInMonth=U.daysInMonth(ym+'-01');const lb=D.g('labors').filter(l=>l.status==='Active');const h=['Labor',...Array.from({length:daysInMonth},(_,i)=>'Day '+(i+1)),'Present','Absent','Half','Leave'];const rows=lb.map(l=>{const recs=att.filter(a=>a.lid===l.id);const row=[l.name];for(let d=1;d<=daysInMonth;d++){const dt=ym+'-'+String(d).padStart(2,'0');const r=recs.find(a=>a.date===dt);row.push(r?r.status:'-')}const st=U.attStats(l.id,ym);row.push(st.present,st.absent,st.half,st.leave);return row});U.csv('Attendance_'+ym+'.csv',h,rows);N.s('Attendance exported')};

PG.monthlySalary=function(){const ym=U.ms().slice(0,7);const lb=D.g('labors').filter(l=>l.status==='Active');const sal=D.g('salaries').filter(s=>s.month===ym);const totalNet=sal.reduce((s,x)=>s+x.netSalary,0);const totalPaid=sal.filter(s=>s.paid).reduce((s,x)=>s+x.netSalary,0);const totalUnpaid=totalNet-totalPaid;return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-money-bill-wave mr-2" style="color:var(--accent)"></i>Monthly Salary</h1><p class="text-xs" style="color:var(--text2)">${U.getMonthName(ym)} ${ym.split('-')[0]}</p></div><div class="flex gap-2 no-print flex-wrap"><input class="inp" type="month" id="sal_ym" value="${ym}" onchange="renderSal()" style="font-size:11.5px;width:160px"><button class="btn btn-p" onclick="calcAllSalaries()"><i class="fas fa-calculator"></i> Calculate All</button><button class="btn btn-success" onclick="payAllSalaries()"><i class="fas fa-check-circle"></i> Pay All</button><button class="btn btn-s" onclick="expSalExcel()"><i class="fas fa-file-excel" style="color:var(--success)"></i> Export</button></div></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Net Salary</div><div class="text-lg font-black" style="color:var(--accent)" id="sal_total">${U.fc(totalNet)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Paid</div><div class="text-lg font-black" style="color:var(--success)" id="sal_paid">${U.fc(totalPaid)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Unpaid</div><div class="text-lg font-black" style="color:var(--error)" id="sal_unpaid">${U.fc(totalUnpaid)}</div></div></div><div id="sal_container"></div>`};
PG.monthlySalaryI=function(){renderSal()};
window.renderSal=function(){const ym=document.getElementById('sal_ym')?.value||U.ms().slice(0,7);const lb=D.g('labors').filter(l=>l.status==='Active');const sal=D.g('salaries').filter(s=>s.month===ym);const totalNet=sal.reduce((s,x)=>s+x.netSalary,0);const totalPaid=sal.filter(s=>s.paid).reduce((s,x)=>s+x.netSalary,0);const totalUnpaid=totalNet-totalPaid;if(document.getElementById('sal_total')){document.getElementById('sal_total').textContent=U.fc(totalNet)}if(document.getElementById('sal_paid')){document.getElementById('sal_paid').textContent=U.fc(totalPaid)}if(document.getElementById('sal_unpaid')){document.getElementById('sal_unpaid').textContent=U.fc(totalUnpaid)}let rows='';lb.forEach(l=>{const s=sal.find(x=>x.lid===l.id);const st=U.attStats(l.id,ym);if(s){rows+=`<tr class="${s.paid?'sal-paid':'sal-unpaid'}"><td class="font-semibold">${l.name}</td><td class="text-xs">${l.mobile||''}</td><td class="text-right">${U.fc(s.baseSalary)}</td><td class="text-center"><span class="badge bg-s">${s.presentDays}</span></td><td class="text-center"><span class="badge bg-a">${s.halfDays}</span></td><td class="text-center"><span class="badge bg-d">${s.absentDays}</span></td><td class="text-center"><span class="badge bg-i">${s.leaveDays}</span></td><td class="text-right font-bold" style="color:var(--success)">${U.fc(s.earnedWages)}</td><td class="text-right" style="color:var(--warn)">${U.fc(s.overtimeAmount||0)}</td><td class="text-right" style="color:var(--error)">${U.fc(s.otherDeductions||0)}</td><td class="text-right" style="color:var(--warn)">${U.fc(s.advance||0)}</td><td class="text-right font-black text-sm" style="color:var(--accent)">${U.fc(s.netSalary)}</td><td class="text-center">${s.paid?'<span class="badge bg-s"><i class="fas fa-check mr-1"></i>Paid</span>':'<span class="badge bg-d">Unpaid</span>'}</td><td class="no-print"><div class="flex gap-1"><button class="btn btn-s" style="padding:3px 7px" onclick="editSal(${l.id},'${ym}')" title="Edit"><i class="fas fa-edit" style="font-size:10px"></i></button> ${!s.paid?`<button class="btn btn-success" style="padding:3px 7px" onclick="markSalPaid(${l.id},'${ym}')" title="Mark Paid"><i class="fas fa-check" style="font-size:10px"></i></button>`:''}<button class="btn btn-s" style="padding:3px 7px" onclick="printSalSlip(${l.id},'${ym}')" title="Print Slip"><i class="fas fa-print" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="resetSal(${l.id},'${ym}')" title="Reset Salary"><i class="fas fa-undo" style="font-size:10px"></i></button></div></td></tr>`}else{rows+=`<tr style="opacity:.6"><td class="font-semibold">${l.name}</td><td class="text-xs">${l.mobile||''}</td><td class="text-right">${U.fc(l.salary||0)}</td><td class="text-center"><span class="badge bg-s">${st.present}</span></td><td class="text-center"><span class="badge bg-a">${st.half}</span></td><td class="text-center"><span class="badge bg-d">${st.absent}</span></td><td class="text-center"><span class="badge bg-i">${st.leave}</span></td><td colspan="6" class="text-center"><button class="btn btn-p" style="padding:3px 12px;font-size:11px" onclick="calcSingleSalary(${l.id},'${ym}')"><i class="fas fa-calculator mr-1"></i>Calculate</button></td><td class="no-print"></td></tr>`}});document.getElementById('sal_container').innerHTML=`<div class="tw"><table><thead><tr><th>Labor</th><th>Mobile</th><th>Base</th><th>Present</th><th>Half</th><th>Absent</th><th>Leave</th><th>Earned</th><th>OT</th><th>Deduct</th><th>Advance</th><th>Net</th><th>Status</th><th class="no-print">Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="14" class="text-center py-8" style="color:var(--text2)">No salary data. Click "Calculate All" to generate.</td></tr>'}</tbody>${sal.length?`<tfoot><tr style="background:var(--card2);font-weight:800"><td colspan="7" class="text-right">TOTALS:</td><td class="text-right" style="color:var(--success)">${U.fc(sal.reduce((s,x)=>s+x.earnedWages,0))}</td><td class="text-right" style="color:var(--warn)">${U.fc(sal.reduce((s,x)=>s+(x.overtimeAmount||0),0))}</td><td class="text-right" style="color:var(--error)">${U.fc(sal.reduce((s,x)=>s+(x.otherDeductions||0),0))}</td><td class="text-right" style="color:var(--warn)">${U.fc(sal.reduce((s,x)=>s+(x.advance||0),0))}</td><td class="text-right" style="color:var(--accent)">${U.fc(totalNet)}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>`};
window.calcSingleSalary=function(lid,ym){const l=D.f('labors',lid);const st=U.attStats(lid,ym);const base=l.salary||0;const daysInMonth=U.daysInMonth(ym+'-01');const perDay=Math.round(base/daysInMonth);const earnedWages=Math.round((st.present+st.half*0.5)*perDay);const absentDeduction=Math.round(st.absent*perDay);const lastDay=ym+'-'+String(daysInMonth).padStart(2,'0');const otAmount=U.overtime(lid,ym+'-01',lastDay);const netSalary=earnedWages-absentDeduction+otAmount;const sal=D.g('salaries');const existing=sal.findIndex(s=>s.lid===lid&&s.month===ym);const data={month:ym,lid,baseSalary:base,presentDays:st.present,halfDays:st.half,absentDays:st.absent,leaveDays:st.leave,earnedWages,overtimeAmount:otAmount,otherDeductions:0,advance:0,netSalary,paid:false,paidDate:'',paidMethod:'Cash'};if(existing>-1){sal[existing]={...sal[existing],...data}}else{D.add('salaries',data)}AU.log('Calculate Salary',l.name+' '+U.fc(netSalary)+' (OT: '+U.fc(otAmount)+')');N.s('Calculated: '+l.name+' = '+U.fc(netSalary));renderSal()};
window.calcAllSalaries=function(){const ym=document.getElementById('sal_ym')?.value||U.ms().slice(0,7);const lb=D.g('labors').filter(l=>l.status==='Active');lb.forEach(l=>calcSingleSalary(l.id,ym));N.s('All salaries calculated')};
window.editSal=function(lid,ym){const sal=D.g('salaries').find(s=>s.lid===lid&&s.month===ym);if(!sal){N.e('Calculate first');return}const l=D.f('labors',lid);mdl('Edit Salary — '+l.name,`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Base Salary</label><input class="inp" type="number" id="es_base" value="${sal.baseSalary}"></div><div><label class="lbl">Present Days</label><input class="inp" type="number" id="es_pres" value="${sal.presentDays}"></div><div><label class="lbl">Half Days</label><input class="inp" type="number" id="es_half" value="${sal.halfDays}"></div><div><label class="lbl">Absent Days</label><input class="inp" type="number" id="es_abs" value="${sal.absentDays}"></div><div><label class="lbl">Leave Days</label><input class="inp" type="number" id="es_leave" value="${sal.leaveDays}"></div><div><label class="lbl">Other Deductions</label><input class="inp" type="number" id="es_ded" value="${sal.otherDeductions||0}"></div><div><label class="lbl">Advance</label><input class="inp" type="number" id="es_adv" value="${sal.advance||0}"></div><div><label class="lbl">Net Salary</label><input class="inp" id="es_net" value="${sal.netSalary}" readonly style="background:var(--card2);font-weight:700;color:var(--accent)"></div></div>`,`<button class="btn btn-s" onclick="cmod()">Cancel</button><button class="btn btn-p" onclick="saveEditSal(${lid},'${ym}')">Save</button>`);['es_base','es_pres','es_half','es_abs','es_ded','es_adv'].forEach(id=>{document.getElementById(id).addEventListener('input',()=>{const base=+document.getElementById('es_base').value;const pres=+document.getElementById('es_pres').value;const half=+document.getElementById('es_half').value;const abs=+document.getElementById('es_abs').value;const ded=+document.getElementById('es_ded').value||0;const adv=+document.getElementById('es_adv').value||0;const dim=U.daysInMonth(ym+'-01');const pd=Math.round(base/dim);document.getElementById('es_net').value=(pres+half*0.5)*pd-abs*pd-ded-adv+(sal.overtimeAmount||0)})})};
window.saveEditSal=function(lid,ym){const sal=D.g('salaries').find(s=>s.lid===lid&&s.month===ym);if(!sal)return;D.upd('salaries',sal.id,{baseSalary:+document.getElementById('es_base').value,presentDays:+document.getElementById('es_pres').value,halfDays:+document.getElementById('es_half').value,absentDays:+document.getElementById('es_abs').value,leaveDays:+document.getElementById('es_leave').value,otherDeductions:+document.getElementById('es_ded').value||0,advance:+document.getElementById('es_adv').value||0,overtimeAmount:sal.overtimeAmount||0,netSalary:+document.getElementById('es_net').value});AU.log('Edit Salary',U.ln(lid));N.s('Salary updated');cmod();renderSal()};
window.markSalPaid=function(lid,ym){const sal=D.g('salaries').find(s=>s.lid===lid&&s.month===ym);if(!sal)return;D.upd('salaries',sal.id,{paid:true,paidDate:U.td(),paidMethod:'Cash'});D.add('payments',{date:U.td(),vno:'SAL-'+sal.id,lid,am:sal.netSalary,method:'Cash',rem:'Monthly salary '+ym});AU.log('Salary Paid',U.ln(lid)+' '+U.fc(sal.netSalary));N.s('Marked as paid');renderSal()};
window.resetSal=function(lid,ym){cfm('Reset calculated salary for '+U.ln(lid)+' for '+ym+'? This will remove the salary record so it can be recalculated.',()=>{const sal=D.g('salaries');const idx=sal.findIndex(s=>s.lid===lid&&s.month===ym);if(idx>-1){sal.splice(idx,1);D.s('salaries',sal);AU.log('Reset Salary',U.ln(lid)+' '+ym);N.s('Salary reset successfully');renderSal()}})};
window.payAllSalaries=function(){const ym=document.getElementById('sal_ym')?.value||U.ms().slice(0,7);const unpaid=D.g('salaries').filter(s=>s.month===ym&&!s.paid);if(!unpaid.length){N.w('No unpaid salaries');return}cfm(`Pay ${unpaid.length} salaries totaling ${U.fc(unpaid.reduce((s,x)=>s+x.netSalary,0))}?`,()=>{unpaid.forEach(s=>{D.upd('salaries',s.id,{paid:true,paidDate:U.td(),paidMethod:'Cash'});D.add('payments',{date:U.td(),vno:'SAL-'+s.id,lid:s.lid,am:s.netSalary,method:'Cash',rem:'Monthly salary '+ym})});AU.log('Pay All Salaries',unpaid.length+' salaries');N.s(unpaid.length+' salaries paid');renderSal()})};
window.printSalSlip=function(lid,ym){const sal=D.g('salaries').find(s=>s.lid===lid&&s.month===ym);if(!sal){N.e('No salary data');return;}const l=D.f('labors',lid);const st=D.go('settings');const loanOut=U.loanOutstanding(lid);const prevMonthDate=new Date(ym+'-01T00:00:00');prevMonthDate.setMonth(prevMonthDate.getMonth()-1);const prevMonthEnd=new Date(prevMonthDate.getFullYear(),prevMonthDate.getMonth()+1,0).toISOString().split('T')[0];const prevEarn=U.earn(lid,null,prevMonthEnd),prevPaid=U.paid(lid,null,prevMonthEnd),prevBal=prevEarn-prevPaid;const currPayments=D.g('payments').filter(p=>p.lid===lid&&p.vno==='SAL-'+sal.id);const currPaid=currPayments.reduce((s,p)=>s+p.am,0);const closingBal=prevBal+sal.netSalary-currPaid;const absentDeduction=sal.absentDays*Math.round(sal.baseSalary/U.daysInMonth(ym+'-01'));const monthEarnings=D.g('workEntries').filter(e=>e.lid===lid&&e.date.startsWith(ym));const totalEarningQty=monthEarnings.reduce((s,e)=>s+e.qty,0);
const html=`<!DOCTYPE html><html><head><title>Salary Slip - ${l.name}</title><style>@page { size: A5 portrait; margin: 10mm; }*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;font-size:11px}body{width:100%;color:#000}.header{text-align:center;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:10px}.header h1{font-size:16px;margin-bottom:2px}.title{text-align:center;font-size:14px;font-weight:bold;margin:10px 0;background:#eee;padding:5px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:10px}.info-box{background:#f9f9f9;padding:8px;border-radius:4px;border:1px solid #ddd}.info-row{display:flex;justify-content:space-between;padding:2px 0}table{width:100%;border-collapse:collapse;margin-bottom:10px}th,td{border:1px solid #ccc;padding:6px;text-align:left}th{background:#f5f5f5;font-size:10px;text-transform:uppercase}.summary{background:#fff3cd;border:1px solid #ffeeba;padding:10px;border-radius:4px}.sum-row{display:flex;justify-content:space-between;padding:4px 0}.sum-bold{font-weight:bold;border-top:1px solid #333;margin-top:5px;padding-top:5px}</style></head><body>
<div class="header"><h1>${st.companyName||'Company'}</h1><p>${st.address||''}</p><p>Phone: ${st.phone||''} | Email: ${st.email||''}</p></div>
<div class="title">SALARY SLIP</div>
<div class="grid-2"><div class="info-box"><div class="info-row"><span><strong>Employee Name:</strong></span> <span>${l.name}</span></div><div class="info-row"><span><strong>Department:</strong></span> <span>${l.dept||'-'}</span></div><div class="info-row"><span><strong>Month:</strong></span> <span>${U.getMonthName(ym)} ${ym.split('-')[0]}</span></div><div class="info-row"><span><strong>Status:</strong></span> <span>${sal.paid?'Paid':'Unpaid'}</span></div></div></div>
<table><thead><tr><th>Attendance & Earnings</th><th>Days / Amount</th></tr></thead><tbody>
<tr><td>Present Days</td><td>${sal.presentDays}</td></tr>
<tr><td>Earned Amount</td><td>${st.curSym||'Rs.'} ${U.fm(sal.earnedWages)}</td></tr>
<tr><td>Overtime Amount</td><td>+ ${st.curSym||'Rs.'} ${U.fm(sal.overtimeAmount||0)}</td></tr>
<tr><td>Total Earned Qty</td><td>${U.fm(totalEarningQty)}</td></tr>
<tr><td>Half Days</td><td>${sal.halfDays}</td></tr>
<tr><td>Base Salary</td><td>${st.curSym||'Rs.'} ${U.fm(sal.baseSalary)}</td></tr>
<tr><td>Absent Days</td><td>${sal.absentDays}</td></tr>
<tr><td>Absent Deduction</td><td>- ${st.curSym||'Rs.'} ${U.fm(absentDeduction)}</td></tr>
<tr><td>Leave Days</td><td>${sal.leaveDays}</td></tr>
<tr><td>Other Deductions (Amount)</td><td>- ${st.curSym||'Rs.'} ${U.fm(sal.otherDeductions||0)}</td></tr>
<tr style="background:#f0f0f0;font-weight:bold;"><td>Net Salary</td><td>${st.curSym||'Rs.'} ${U.fm(sal.netSalary)}</td></tr>
</tbody></table>
<table><thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead><tbody>${currPayments.length?currPayments.map(p=>`<tr><td>${U.fd(p.date)}</td><td>${p.rem||'Salary Payment'}</td><td>${U.fm(p.am)}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;">No Payments Made Yet</td></tr>'}<tr style="background:#f0f0f0;font-weight:bold;"><td colspan="2">Paid Amount this Month</td><td>${U.fm(currPaid)}</td></tr></tbody></table>
<div class="summary"><div class="sum-row"><span>Opening Balance:</span> <strong>${st.curSym||'Rs.'} ${U.fm(prevBal)}</strong></div><div class="sum-row"><span>(+) Current Month Net Salary:</span> <strong>${st.curSym||'Rs.'} ${U.fm(sal.netSalary)}</strong></div><div class="sum-row"><span>(-) Paid Amount this Month:</span> <strong>${st.curSym||'Rs.'} ${U.fm(currPaid)}</strong></div><div class="sum-row"><span>Long-Term Loan Outstanding (Memo):</span> <strong>${st.curSym||'Rs.'} ${U.fm(loanOut)}</strong></div><div class="sum-row sum-bold"><span>Closing Balance Due:</span> <strong>${st.curSym||'Rs.'} ${U.fm(closingBal)}</strong></div></div>
</body></html>`;const w=window.open('','_blank','width=600,height=800');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);}else{N.e('Please allow popups to print.');}};
window.expSalExcel=function(){const ym=document.getElementById('sal_ym')?.value||U.ms().slice(0,7);const sal=D.g('salaries').filter(s=>s.month===ym);if(!sal.length){N.w('No salary data');return}try{const wb=XLSX.utils.book_new();const data=sal.map(s=>({Labor:U.ln(s.lid),Mobile:D.f('labors',s.lid)?.mobile||'','Base Salary':s.baseSalary,'Present Days':s.presentDays,'Half Days':s.halfDays,'Absent Days':s.absentDays,'Leave Days':s.leaveDays,'Earned Wages':s.earnedWages,Overtime:s.overtimeAmount||0,'Other Deductions':s.otherDeductions||0,Advance:s.advance||0,'Net Salary':s.netSalary,Paid:s.paid?'Yes':'No','Paid Date':s.paidDate||'','Paid Method':s.paidMethod||''}));const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=Object.keys(data[0]||{}).map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,ws,'Salary '+ym);XLSX.writeFile(wb,'Salary_'+ym+'.xlsx');N.s('Salary Excel exported')}catch(e){N.e('Export failed')}};

window.renderRptLabor=function(){const from=document.getElementById('rpt_l_from')?.value||'';const to=document.getElementById('rpt_l_to')?.value||'';const we=D.g('workEntries').filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));let html='';if(!we.length){document.getElementById('rpt_labor_content').innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>No work entries found in selected date range</p></div>';return}if(laborTab==='item'){const items=D.g('items');const data=items.map(i=>{const entries=we.filter(e=>e.iid===i.id);const qty=entries.reduce((s,e)=>s+e.qty,0);const amt=entries.reduce((s,e)=>s+e.amt,0);return{item:i,qty,amt,entries:entries.length}}).filter(x=>x.qty>0).sort((a,b)=>b.amt-a.amt);const totalQty=data.reduce((s,x)=>s+x.qty,0);const totalAmt=data.reduce((s,x)=>s+x.amt,0);html=`<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Items</div><div class="text-lg font-black" style="color:var(--accent)">${data.length}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Qty</div><div class="text-lg font-black" style="color:var(--info)">${U.fm(totalQty)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Amount</div><div class="text-lg font-black" style="color:var(--success)">${U.fc(totalAmt)}</div></div></div><div class="tw"><table><thead><tr><th>Code</th><th>Item Name</th><th>Category</th><th>Entries</th><th>Qty</th><th>Amount</th><th>% of Total</th></tr></thead><tbody>${data.map(d=>`<tr><td class="font-mono text-xs">${d.item.code}</td><td class="font-semibold">${d.item.name}</td><td><span class="badge bg-i">${d.item.cat||''}</span></td><td class="text-center">${d.entries}</td><td class="text-center font-bold">${U.fm(d.qty)}</td><td class="text-right font-bold" style="color:var(--accent)">${U.fc(d.amt)}</td><td class="text-right text-xs" style="color:var(--text2)">${totalAmt?(d.amt/totalAmt*100).toFixed(1):0}%</td></tr>`).join('')}${data.length?`<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">TOTAL:</td><td class="text-center font-bold">${data.reduce((s,x)=>s+x.entries,0)}</td><td class="text-center font-black">${U.fm(totalQty)}</td><td class="text-right font-black" style="color:var(--accent)">${U.fc(totalAmt)}</td><td></td></tr>`:''}</tbody></table></div>`}else if(laborTab==='service'){const services=D.g('services');const data=services.map(s=>{const entries=we.filter(e=>e.sid===s.id);const qty=entries.reduce((a,e)=>a+e.qty,0);const amt=entries.reduce((a,e)=>a+e.amt,0);return{service:s,qty,amt,entries:entries.length}}).filter(x=>x.qty>0).sort((a,b)=>b.amt-a.amt);const totalQty=data.reduce((s,x)=>s+x.qty,0);const totalAmt=data.reduce((s,x)=>s+x.amt,0);html=`<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Services</div><div class="text-lg font-black" style="color:var(--accent)">${data.length}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Qty</div><div class="text-lg font-black" style="color:var(--info)">${U.fm(totalQty)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Amount</div><div class="text-lg font-black" style="color:var(--success)">${U.fc(totalAmt)}</div></div></div><div class="tw"><table><thead><tr><th>Service</th><th>Description</th><th>Entries</th><th>Qty</th><th>Amount</th><th>% of Total</th></tr></thead><tbody>${data.map(d=>`<tr><td class="font-semibold">${d.service.name}</td><td class="text-xs" style="color:var(--text2)">${d.service.desc||''}</td><td class="text-center">${d.entries}</td><td class="text-center font-bold">${U.fm(d.qty)}</td><td class="text-right font-bold" style="color:var(--accent)">${U.fc(d.amt)}</td><td class="text-right text-xs" style="color:var(--text2)">${totalAmt?(d.amt/totalAmt*100).toFixed(1):0}%</td></tr>`).join('')}${data.length?`<tr style="background:var(--card2)"><td colspan="2" class="text-right font-bold">TOTAL:</td><td class="text-center font-bold">${data.reduce((s,x)=>s+x.entries,0)}</td><td class="text-center font-black">${U.fm(totalQty)}</td><td class="text-right font-black" style="color:var(--accent)">${U.fc(totalAmt)}</td><td></td></tr>`:''}</tbody></table></div>`}else if(laborTab==='date'){const dates=[...new Set(we.map(e=>e.date))].sort();const data=dates.map(d=>{const entries=we.filter(e=>e.date===d);const qty=entries.reduce((s,e)=>s+e.qty,0);const amt=entries.reduce((s,e)=>s+e.amt,0);return{date:d,qty,amt,entries:entries.length,laborCount:new Set(entries.map(e=>e.lid)).size}});const totalQty=data.reduce((s,x)=>s+x.qty,0);const totalAmt=data.reduce((s,x)=>s+x.amt,0);const totalEntries=data.reduce((s,x)=>s+x.entries,0);html=`<div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Days</div><div class="text-lg font-black" style="color:var(--accent)">${data.length}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Entries</div><div class="text-lg font-black" style="color:var(--info)">${totalEntries}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Qty</div><div class="text-lg font-black" style="color:var(--warn)">${U.fm(totalQty)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Amount</div><div class="text-lg font-black" style="color:var(--success)">${U.fc(totalAmt)}</div></div></div><div class="tw"><table><thead><tr><th>Date</th><th>Day</th><th>Entries</th><th>Labors</th><th>Qty</th><th>Amount</th><th>% of Total</th></tr></thead><tbody>${data.map(d=>{const day=new Date(d.date).toLocaleDateString('en-GB',{weekday:'short'});return `<tr><td class="text-xs">${U.fd(d.date)}</td><td><span class="badge bg-i">${day}</span></td><td class="text-center">${d.entries}</td><td class="text-center">${d.laborCount}</td><td class="text-center font-bold">${U.fm(d.qty)}</td><td class="text-right font-bold" style="color:var(--accent)">${U.fc(d.amt)}</td><td class="text-right text-xs" style="color:var(--text2)">${totalAmt?(d.amt/totalAmt*100).toFixed(1):0}%</td></tr>`}).join('')}${data.length?`<tr style="background:var(--card2)"><td colspan="2" class="text-right font-bold">TOTAL:</td><td class="text-center font-bold">${totalEntries}</td><td></td><td class="text-center font-black">${U.fm(totalQty)}</td><td class="text-right font-black" style="color:var(--accent)">${U.fc(totalAmt)}</td><td></td></tr>`:''}</tbody></table></div>`}document.getElementById('rpt_labor_content').innerHTML=html};
window.expRptLabor=function(){const from=document.getElementById('rpt_l_from')?.value||'';const to=document.getElementById('rpt_l_to')?.value||'';const we=D.g('workEntries').filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));if(!we.length){N.w('No data');return}let h,rows;if(laborTab==='item'){const items=D.g('items');h=['Code','Item','Category','Entries','Qty','Amount','% of Total'];rows=items.map(i=>{const e=we.filter(x=>x.iid===i.id);const q=e.reduce((s,x)=>s+x.qty,0);const a=e.reduce((s,x)=>s+x.amt,0);return q>0?[i.code,i.name,i.cat||'',e.length,q,a,'']:[]}).filter(r=>r.length)}else if(laborTab==='service'){const services=D.g('services');h=['Service','Description','Entries','Qty','Amount','% of Total'];rows=services.map(s=>{const e=we.filter(x=>x.sid===s.id);const q=e.reduce((a,x)=>a+x.qty,0);const am=e.reduce((a,x)=>a+x.amt,0);return q>0?[s.name,s.desc||'',e.length,q,am,'']:[]}).filter(r=>r.length)}else{const dates=[...new Set(we.map(e=>e.date))].sort();h=['Date','Entries','Labors','Qty','Amount','% of Total'];rows=dates.map(d=>{const e=we.filter(x=>x.date===d);const q=e.reduce((s,x)=>s+x.qty,0);const a=e.reduce((s,x)=>s+x.amt,0);return[d,e.length,new Set(e.map(x=>x.lid)).size,q,a,'']})}U.csv('Labor_Report_'+laborTab+'.csv',h,rows);N.s('Report exported')};

window.renderRptExpense=function(){const from=document.getElementById('rpt_e_from')?.value||'';const to=document.getElementById('rpt_e_to')?.value||'';const ex=D.g('expenses').filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));let html='';if(!ex.length){document.getElementById('rpt_expense_content').innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>No expenses found in selected date range</p></div>';return}if(expenseTab==='cat'){const ec=D.g('expCats');const data=ec.map(c=>{const entries=ex.filter(e=>e.cid===c.id);const amt=entries.reduce((s,e)=>s+e.am,0);return{cat:c,amt,entries:entries.length}}).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);const total=data.reduce((s,x)=>s+x.amt,0);html=`<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Categories</div><div class="text-lg font-black" style="color:var(--accent)">${data.length}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Entries</div><div class="text-lg font-black" style="color:var(--info)">${data.reduce((s,x)=>s+x.entries,0)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Amount</div><div class="text-lg font-black" style="color:var(--error)">${U.fc(total)}</div></div></div><div class="tw"><table><thead><tr><th>#</th><th>Category</th><th>Entries</th><th>Amount</th><th>% of Total</th></tr></thead><tbody>${data.map((d,i)=>`<tr><td class="text-xs">${i+1}</td><td class="font-semibold">${d.cat.name}</td><td class="text-center">${d.entries}</td><td class="text-right font-bold" style="color:var(--error)">${U.fc(d.amt)}</td><td class="text-right text-xs" style="color:var(--text2)">${total?(d.amt/total*100).toFixed(1):0}%</td></tr>`).join('')}${data.length?`<tr style="background:var(--card2)"><td colspan="2" class="text-right font-bold">TOTAL:</td><td class="text-center font-bold">${data.reduce((s,x)=>s+x.entries,0)}</td><td class="text-right font-black" style="color:var(--error)">${U.fc(total)}</td><td></td></tr>`:''}</tbody></table></div>`}else{const dates=[...new Set(ex.map(e=>e.date))].sort();const data=dates.map(d=>{const entries=ex.filter(e=>e.date===d);const amt=entries.reduce((s,e)=>s+e.am,0);return{date:d,amt,entries:entries.length,cats:new Set(entries.map(e=>e.cid)).size}});const total=data.reduce((s,x)=>s+x.amt,0);const totalEntries=data.reduce((s,x)=>s+x.entries,0);html=`<div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Days</div><div class="text-lg font-black" style="color:var(--accent)">${data.length}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Entries</div><div class="text-lg font-black" style="color:var(--info)">${totalEntries}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Avg / Day</div><div class="text-lg font-black" style="color:var(--warn)">${U.fc(data.length?Math.round(total/data.length):0)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Amount</div><div class="text-lg font-black" style="color:var(--error)">${U.fc(total)}</div></div></div><div class="tw"><table><thead><tr><th>#</th><th>Date</th><th>Day</th><th>Entries</th><th>Categories</th><th>Amount</th><th>% of Total</th></tr></thead><tbody>${data.map((d,i)=>{const day=new Date(d.date).toLocaleDateString('en-GB',{weekday:'short'});return `<tr><td class="text-xs">${i+1}</td><td class="text-xs">${U.fd(d.date)}</td><td><span class="badge bg-i">${day}</span></td><td class="text-center">${d.entries}</td><td class="text-center">${d.cats}</td><td class="text-right font-bold" style="color:var(--error)">${U.fc(d.amt)}</td><td class="text-right text-xs" style="color:var(--text2)">${total?(d.amt/total*100).toFixed(1):0}%</td></tr>`}).join('')}${data.length?`<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">TOTAL:</td><td class="text-center font-bold">${totalEntries}</td><td></td><td class="text-right font-black" style="color:var(--error)">${U.fc(total)}</td><td></td></tr>`:''}</tbody></table></div>`}document.getElementById('rpt_expense_content').innerHTML=html};
window.expRptExpense=function(){const from=document.getElementById('rpt_e_from')?.value||'';const to=document.getElementById('rpt_e_to')?.value||'';const ex=D.g('expenses').filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));if(!ex.length){N.w('No data');return}let h,rows;if(expenseTab==='cat'){const ec=D.g('expCats');h=['Category','Entries','Amount','% of Total'];rows=ec.map(c=>{const e=ex.filter(x=>x.cid===c.id);const a=e.reduce((s,x)=>s+x.am,0);return a>0?[c.name,e.length,a,'']:[]}).filter(r=>r.length)}else{const dates=[...new Set(ex.map(e=>e.date))].sort();h=['Date','Day','Entries','Categories','Amount','% of Total'];rows=dates.map(d=>{const e=ex.filter(x=>x.date===d);const day=new Date(d).toLocaleDateString('en-GB',{weekday:'short'});return[d,day,e.length,new Set(e.map(x=>x.cid)).size,e.reduce((s,x)=>s+x.am,0),'']})}U.csv('Expense_Report_'+expenseTab+'.csv',h,rows);N.s('Report exported')};

PG.backup=function(){const cfg=D.go('settings');return`<div class="mb-4"><h1 class="text-xl font-black">Backup & Restore</h1></div><div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-bolt mr-2" style="color:var(--accent)"></i>Quick Backup</h3><p class="text-xs mb-3" style="color:var(--text2)">Instantly save a backup file to a specific folder on your computer.</p><button class="btn btn-p" onclick="quickBackup()"><i class="fas fa-download"></i> Quick Backup to Folder</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div class="card"><h3 class="font-bold text-sm mb-3"><i class="fas fa-download mr-2" style="color:var(--success)"></i>Manual Backup</h3><p class="text-xs mb-3" style="color:var(--text2)">Download complete database backup. You will be prompted to select the folder and file name (supported in Chrome/Edge).</p><button class="btn btn-p" onclick="doBackup()"><i class="fas fa-download"></i> Download Backup</button></div><div class="card"><h3 class="font-bold text-sm mb-3"><i class="fas fa-upload mr-2" style="color:var(--info)"></i>Restore</h3><p class="text-xs mb-3" style="color:var(--text2)">Restore from a JSON backup file. This will overwrite all data.</p><input type="file" id="restoreFile" accept=".json" class="inp mb-3"><button class="btn btn-d" onclick="doRestore()"><i class="fas fa-upload"></i> Restore</button></div></div><div class="card"><h3 class="font-bold text-sm mb-3"><i class="fas fa-clock mr-2" style="color:var(--accent)"></i>Schedule Auto Backup</h3><p class="text-xs mb-3" style="color:var(--text2)">Automatically triggers a backup to your browser's default download folder while the app is open.</p><div class="flex flex-wrap gap-3 items-end"><div><label class="lbl">Enable Auto Backup</label><select class="inp" id="cfg_autoBackupEn" style="width:120px"><option value="true" ${cfg.autoBackupEnabled?'selected':''}>Enabled</option><option value="false" ${!cfg.autoBackupEnabled?'selected':''}>Disabled</option></select></div><div><label class="lbl">Interval</label><select class="inp" id="cfg_autoBackupInt" style="width:150px"><option value="60" ${cfg.autoBackupInterval==='60'?'selected':''}>Every 1 Hour</option><option value="240" ${cfg.autoBackupInterval==='240'?'selected':''}>Every 4 Hours</option><option value="720" ${cfg.autoBackupInterval==='720'?'selected':''}>Every 12 Hours</option><option value="1440" ${cfg.autoBackupInterval==='1440'?'selected':''}>Every 24 Hours</option></select></div><button class="btn btn-p" onclick="saveBackupSchedule()">Save Schedule</button></div></div>`};
window.quickBackup=async function(){let data={};['users','labors','services','items','wageRates','workEntries','overtime','payments','cashReceived','cashPaid','expenses','expCats','attendance','salaries','loans','audit'].forEach(k=>data[k]=D.g(k));data.settings=D.go('settings');data.adminConfig=D.go('adminConfig');let jsonStr=JSON.stringify(data,null,2),fn='LaborPro_Backup_'+U.td()+'.json';if(window.showSaveFilePicker){try{let h=await window.showSaveFilePicker({suggestedName:fn,types:[{description:'JSON File',accept:{'application/json':['.json']}}]});let w=await h.createWritable();await w.write(jsonStr);await w.close();N.s('Backup saved successfully to selected folder!');AU.log('Quick Backup Saved');}catch(e){if(e.name!=='AbortError')N.e('Failed: '+e.message);}}else{let b=new Blob([jsonStr],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click();N.s('Backup downloaded (folder selection not supported by browser).');}};
window.saveBackupSchedule=function(){const cfg=D.go('settings');D.so('settings',{...cfg,autoBackupEnabled:document.getElementById('cfg_autoBackupEn').value==='true',autoBackupInterval:document.getElementById('cfg_autoBackupInt').value,autoBackupLastRun:cfg.autoBackupLastRun||new Date().toISOString()});N.s('Auto backup schedule saved!');APP.initAutoBackup();};
window.doBackup=function(isAuto){const data={};['users','labors','services','items','wageRates','workEntries','overtime','payments','cashReceived','cashPaid','expenses','expCats','attendance','salaries','loans','audit'].forEach(k=>{data[k]=D.g(k)});data.settings=D.go('settings');data.adminConfig=D.go('adminConfig');const jsonStr=JSON.stringify(data,null,2);const filename='LaborPro_Backup_'+U.td()+'.json';if(!isAuto&&window.showSaveFilePicker){window.showSaveFilePicker({suggestedName:filename,types:[{description:'JSON Backup File',accept:{'application/json':['.json']}}]}).then(handle=>{handle.createWritable().then(writable=>{writable.write(jsonStr);writable.close();N.s('Backup saved successfully to selected folder!');AU.log('Backup Saved to Folder');}).catch(err=>N.e('Save failed: '+err));}).catch(err=>{if(err.name!=='AbortError')N.e('Backup failed: '+err);});}else{const b=new Blob([jsonStr],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();if(!isAuto)N.s('Backup downloaded');if(isAuto){N.i('Auto Backup Triggered!');AU.log('Auto Backup Triggered');}else{AU.log('Backup Downloaded');}}};
window.doRestore=function(){const f=document.getElementById('restoreFile').files[0];if(!f){N.e('Select file');return}cfm('This will overwrite ALL data. Continue?',()=>{const r=new FileReader();r.onload=function(e){try{const data=JSON.parse(e.target.result);Object.keys(data).forEach(k=>{if(k==='settings')D.so(k,data[k]);else if(k==='adminConfig')D.so(k,data[k]);else D.s(k,data[k])});N.s('Restored successfully');AU.log('Restore','Data restored');APP.go('dashboard')}catch(err){N.e('Invalid file')}};r.readAsText(f)})};
PG.settings=function(){const s=D.go('settings');return`<div class="mb-4"><h1 class="text-xl font-black">Settings</h1></div><div class="card" style="max-width:600px"><div class="space-y-3"><div><label class="lbl">Company Name</label><input class="inp" id="s_cn" value="${s.companyName||''}"></div><div><label class="lbl">Address</label><input class="inp" id="s_addr" value="${s.address||''}"></div><div class="grid grid-cols-2 gap-3"><div><label class="lbl">Phone</label><input class="inp" id="s_ph" value="${s.phone||''}"></div><div><label class="lbl">Email</label><input class="inp" id="s_em" value="${s.email||''}"></div></div><div class="grid grid-cols-3 gap-3"><div><label class="lbl">Currency</label><input class="inp" id="s_cur" value="${s.cur||'PKR'}"></div><div><label class="lbl">Symbol</label><input class="inp" id="s_sym" value="${s.curSym||'Rs.'}"></div><div><label class="lbl">FY</label><input class="inp" id="s_fy" value="${s.fy||''}"></div></div><div><label class="lbl">Opening Balance</label><input class="inp" type="number" id="s_ob" value="${s.openingBal||0}"></div><button class="btn btn-p" onclick="saveSettings()"><i class="fas fa-save"></i> Save Settings</button></div></div>`};
window.saveSettings=function(){D.so('settings',{companyName:document.getElementById('s_cn').value,address:document.getElementById('s_addr').value,phone:document.getElementById('s_ph').value,email:document.getElementById('s_em').value,cur:document.getElementById('s_cur').value,curSym:document.getElementById('s_sym').value,fy:document.getElementById('s_fy').value,openingBal:+document.getElementById('s_ob').value||0,theme:D.go('settings').theme,tax:0,autoBackupEnabled:D.go('settings').autoBackupEnabled,autoBackupInterval:D.go('settings').autoBackupInterval,autoBackupLastRun:D.go('settings').autoBackupLastRun});AU.log('Settings Updated');N.s('Settings saved')};

PG.userMgmt=function(){const users=D.g('users');const activeCount=users.filter(u=>u.status==='Active').length;const adminCount=users.filter(u=>u.role==='Admin').length;return `<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-user-shield mr-2" style="color:var(--accent)"></i>User Management</h1><p class="text-xs" style="color:var(--text2)">${users.length} users | ${activeCount} active | ${adminCount} admin(s)</p></div><div class="flex gap-2 no-print flex-wrap"><div class="sg"><i class="fas fa-search"></i><input class="inp" placeholder="Search users..." onkeyup="mf('users',this.value)" style="font-size:11.5px;padding:6px 10px 6px 32px;width:180px"></div><button class="btn btn-p" onclick="showUserForm()"><i class="fas fa-user-plus"></i> Add User</button><button class="btn btn-s" onclick="expM('users','Users')"><i class="fas fa-download"></i></button></div></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"><div class="card stat-card"><div class="w-8 h-8 rounded-lg flex items-center justify-center mb-2" style="background:rgba(6,182,212,.15)"><i class="fas fa-users text-xs" style="color:var(--info)"></i></div><div class="text-lg font-black">${users.length}</div><div class="text-xs" style="color:var(--text2)">Total Users</div></div><div class="card stat-card"><div class="w-8 h-8 rounded-lg flex items-center justify-center mb-2" style="background:rgba(16,185,129,.15)"><i class="fas fa-user-check text-xs" style="color:var(--success)"></i></div><div class="text-lg font-black">${activeCount}</div><div class="text-xs" style="color:var(--text2)">Active</div></div><div class="card stat-card"><div class="w-8 h-8 rounded-lg flex items-center justify-center mb-2" style="background:rgba(245,158,11,.15)"><i class="fas fa-user-shield text-xs" style="color:var(--accent)"></i></div><div class="text-lg font-black">${adminCount}</div><div class="text-xs" style="color:var(--text2)">Admins</div></div><div class="card stat-card"><div class="w-8 h-8 rounded-lg flex items-center justify-center mb-2" style="background:rgba(239,68,68,.15)"><i class="fas fa-user-times text-xs" style="color:var(--error)"></i></div><div class="text-lg font-black">${users.length-activeCount}</div><div class="text-xs" style="color:var(--text2)">Inactive</div></div></div><div class="tw" id="tb_users"><table><thead><tr><th>ID</th><th>Name</th><th>Username</th><th>Role</th><th>Email</th><th>Mobile</th><th>Last Login</th><th>Status</th><th class="no-print">Actions</th></tr></thead><tbody>${users.length?users.map(u=>`<tr><td class="font-semibold text-xs">#${u.id}</td><td class="font-semibold"><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs" style="background:${u.role==='Admin'?'var(--accent)':u.role==='Accountant'?'var(--info)':'var(--success)'};color:#000">${u.name[0]}</div>${u.name}</div></td><td class="text-xs font-mono">${u.username}</td><td><span class="badge ${u.role==='Admin'?'bg-a':u.role==='Accountant'?'bg-i':'bg-s'}">${u.role}</span></td><td class="text-xs" style="color:var(--text2)">${u.email||'-'}</td><td class="text-xs" style="color:var(--text2)">${u.mobile||'-'}</td><td class="text-xs" style="color:var(--text2)">${u.lastLogin?new Date(u.lastLogin).toLocaleString('en-GB'):'Never'}</td><td><span class="badge ${u.status==='Active'?'bg-s':'bg-d'}">${u.status||'Active'}</span></td><td class="no-print"><div class="flex gap-1"><button class="btn btn-s" style="padding:3px 7px" onclick="showUserForm(${u.id})" title="Edit"><i class="fas fa-edit" style="font-size:10px"></i></button><button class="btn btn-s" style="padding:3px 7px" onclick="resetUserPass(${u.id})" title="Reset Password"><i class="fas fa-key" style="font-size:10px"></i></button><button class="btn btn-s" style="padding:3px 7px" onclick="toggleUserStatus(${u.id})" title="${u.status==='Active'?'Deactivate':'Activate'}"><i class="fas fa-${u.status==='Active'?'user-slash':'user-check'}" style="font-size:10px"></i></button>${u.id!==A.cu.id?`<button class="btn btn-d" style="padding:3px 7px" onclick="delUser(${u.id})" title="Delete"><i class="fas fa-trash" style="font-size:10px"></i></button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="9" class="text-center py-8" style="color:var(--text2)"><i class="fas fa-users text-2xl mb-2 block opacity:25"></i>No users</td></tr>'}</tbody></table></div>`};
window.showUserForm=function(id){const u=id?D.f('users',id):{};const allPerms=[{k:'dashboard',l:'Dashboard'},{k:'laborMaster',l:'Labor Master'},{k:'attendance',l:'Attendance'},{k:'workEntry',l:'Work Entry'},{k:'overtime',l:'Overtime'},{k:'laborLedger',l:'Labor Ledger'},{k:'laborLoans',l:'Labor Loans'},{k:'monthlySalary',l:'Monthly Salary'},{k:'laborPayables',l:'Labor Payables'},{k:'wageSlip',l:'Wage Slip'},{k:'cashBook',l:'Cash Book'},{k:'serviceMaster',l:'Service Master'},{k:'itemMaster',l:'Item Master'},{k:'wageRates',l:'Wage Rates'},{k:'expCats',l:'Expense Categories'},{k:'rptLabor',l:'Labor Reports'},{k:'rptCash',l:'Cash Reports'},{k:'rptExpense',l:'Expense Reports'},{k:'auditLog',l:'Audit Log'},{k:'backup',l:'Backup & Restore'},{k:'settings',l:'Settings'},{k:'userMgmt',l:'User Management'},{k:'adminConfig',l:'Admin Configuration'}];const currentPerms=u.permissions||[];mdl(id?'Edit User':'Add User',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4"><div><label class="lbl">Full Name *</label><input class="inp" id="u_name" value="${u.name||''}"></div><div><label class="lbl">Username *</label><input class="inp" id="u_username" value="${u.username||''}" ${id?'readonly':''}></div><div><label class="lbl">${id?'New Password':'Password *'}</label><input class="inp" type="password" id="u_pass" placeholder="${id?'Leave blank to keep current':'Enter password'}" value="" autocomplete="new-password"></div><div><label class="lbl">Role *</label><select class="inp" id="u_role" onchange="togglePermSection(this.value)"><option value="Admin" ${u.role==='Admin'?'selected':''}>Admin</option><option value="Accountant" ${u.role==='Accountant'?'selected':''}>Accountant</option><option value="Operator" ${u.role==='Operator'?'selected':''}>Operator</option><option value="Viewer" ${u.role==='Viewer'?'selected':''}>Viewer</option></select></div><div><label class="lbl">Email</label><input class="inp" type="email" id="u_email" value="${u.email||''}"></div><div><label class="lbl">Mobile</label><input class="inp" id="u_mobile" value="${u.mobile||''}"></div><div><label class="lbl">Status</label><select class="inp" id="u_status"><option value="Active" ${u.status!=='Inactive'?'selected':''}>Active</option><option value="Inactive" ${u.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div id="perm_section" style="${u.role==='Admin'?'display:none':'display:block'}"><label class="lbl mb-2">Module Permissions</label><div class="perm-grid">${allPerms.map(p=>`<label class="perm-item ${currentPerms.includes(p.k)||currentPerms.includes('all')?'checked':''}"><input type="checkbox" value="${p.k}" ${currentPerms.includes(p.k)||currentPerms.includes('all')?'checked':''}> <span>${p.l}</span></label>`).join('')}</div><p class="text-xs mt-2" style="color:var(--text2)"><i class="fas fa-info-circle mr-1"></i>Admin role automatically has access to all modules.</p></div>`, vf('saveUser', id, 'users', 'showUserForm'), true);document.querySelectorAll('#perm_section .perm-item').forEach(el=>{el.addEventListener('click',()=>{el.classList.toggle('checked');el.querySelector('input').checked=el.classList.contains('checked')})})};
window.togglePermSection=function(role){const sec=document.getElementById('perm_section');if(sec)sec.style.display=role==='Admin'?'none':'block'};
window.saveUser=function(id, isNew){const name=document.getElementById('u_name').value.trim();const username=document.getElementById('u_username').value.trim();const pass=document.getElementById('u_pass').value;const role=document.getElementById('u_role').value;const email=document.getElementById('u_email').value.trim();const mobile=document.getElementById('u_mobile').value.trim();const status=document.getElementById('u_status').value;if(!name||!username){N.e('Name and username required');return}if(!id&&!pass){N.e('Password required for new user');return}const existing=D.g('users').find(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id);if(existing){N.e('Username already exists');return}const perms=role==='Admin'?['all']:Array.from(document.querySelectorAll('#perm_section input:checked')).map(c=>c.value);if(id){const u=D.f('users',id);const data={name,username,role,email,mobile,status,permissions:perms};if(pass)data.password=simpleHash(pass);D.upd('users',id,data);AU.log('Edit User',name+' ('+username+')');N.s('User updated')}else{D.add('users',{name,username,password:simpleHash(pass),role,email,mobile,status,permissions:perms,lastLogin:''});AU.log('Add User',name+' ('+username+')');N.s('User added')}if(isNew){showUserForm()}else{cmod();APP.go('userMgmt')}};
window.delUser=function(id){const u=D.f('users',id);if(!u)return;if(u.username==='admin'){N.e('Cannot delete primary admin');return}if(id===A.cu.id){N.e('Cannot delete yourself');return}cfm(`Delete user "${u.name}" (${u.username})?`,()=>{D.rm('users',id);AU.log('Delete User',u.name+' ('+u.username+')');N.s('User deleted');APP.go('userMgmt')})};
window.resetUserPass=function(id){const u=D.f('users',id);if(!u)return;mdl('Reset Password — '+u.name,`<div class="space-y-3"><div><label class="lbl">New Password *</label><input class="inp" type="password" id="rp_pass" placeholder="Enter new password" autocomplete="new-password"></div><div><label class="lbl">Confirm Password *</label><input class="inp" type="password" id="rp_confirm" placeholder="Confirm new password" autocomplete="new-password"></div></div>`,`<button class="btn btn-s" onclick="cmod()">Cancel</button><button class="btn btn-p" onclick="doResetPass(${id})">Reset</button>`)};
window.doResetPass=function(id){const pass=document.getElementById('rp_pass').value;const confirm=document.getElementById('rp_confirm').value;if(!pass){N.e('Enter password');return}if(pass!==confirm){N.e('Passwords do not match');return}if(pass.length<6){N.e('Password must be at least 6 characters');return}D.upd('users',id,{password:simpleHash(pass)});const u=D.f('users',id);AU.log('Reset Password',u.name+' ('+u.username+')');N.s('Password reset for '+u.name);cmod()};
window.toggleUserStatus=function(id){const u=D.f('users',id);if(!u)return;if(u.username==='admin'&&u.status==='Active'){N.e('Cannot deactivate primary admin');return}const newStatus=u.status==='Active'?'Inactive':'Active';D.upd('users',id,{status:newStatus});AU.log('Toggle User Status',u.name+' -> '+newStatus);N.s(u.name+' is now '+newStatus);APP.go('userMgmt')};

window.renderAdminConfig=function(){const cfg=D.go('adminConfig');const cont=document.getElementById('admin_config_content');let html='';if(adminTab==='general'){html=`<div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-cog mr-2" style="color:var(--accent)"></i>General Settings</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Working Days Per Month</label><input class="inp" type="number" id="cfg_workingDays" value="${cfg.workingDaysPerMonth||26}" min="1" max="31"></div><div><label class="lbl">Session Timeout (minutes)</label><input class="inp" type="number" id="cfg_session" value="${cfg.sessionTimeout||60}" min="5"></div><div><label class="lbl">Minimum Password Length</label><input class="inp" type="number" id="cfg_minPass" value="${cfg.minPasswordLength||6}" min="4"></div><div><label class="lbl">Low Balance Threshold</label><input class="inp" type="number" id="cfg_lowBal" value="${cfg.lowBalanceThreshold||5000}" min="0"></div><div><label class="lbl">Currency Position</label><select class="inp" id="cfg_curPos"><option value="before" ${cfg.currencyPosition==='before'?'selected':''}>Before Amount (Rs. 1,000)</option><option value="after" ${cfg.currencyPosition==='after'?'selected':''}>After Amount (1,000 Rs.)</option></select></div><div><label class="lbl">Date Format</label><select class="inp" id="cfg_dateFmt"><option value="DD-MM-YYYY" ${cfg.dateFormat==='DD-MM-YYYY'?'selected':''}>DD-MM-YYYY</option><option value="MM-DD-YYYY" ${cfg.dateFormat==='MM-DD-YYYY'?'selected':''}>MM-DD-YYYY</option><option value="YYYY-MM-DD" ${cfg.dateFormat==='YYYY-MM-DD'?'selected':''}>YYYY-MM-DD</option></select></div></div><div class="mt-3 space-y-2"><label class="perm-item checked" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);cursor:pointer"><input type="checkbox" id="cfg_notif" ${cfg.enableNotifications?'checked':''}> <span><i class="fas fa-bell mr-1"></i> Enable System Notifications</span></label><label class="perm-item checked" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);cursor:pointer"><input type="checkbox" id="cfg_autoPresent" ${cfg.autoMarkPresent?'checked':''}> <span><i class="fas fa-magic mr-1"></i> Auto-mark present for active labors on weekdays</span></label><label class="perm-item checked" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);cursor:pointer"><input type="checkbox" id="cfg_reqRemarks" ${cfg.requireRemarks?'checked':''}> <span><i class="fas fa-comment-dots mr-1"></i> Require remarks on work entries</span></label></div></div>`}else if(adminTab==='tax'){html=`<div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-percent mr-2" style="color:var(--accent)"></i>Tax Configuration</h3><label class="perm-item checked mb-3" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);cursor:pointer"><input type="checkbox" id="cfg_taxEn" ${cfg.taxEnabled?'checked':''}> <span>Enable Tax Calculation</span></label><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Tax Rate (%)</label><input class="inp" type="number" id="cfg_taxRate" value="${cfg.taxRate||0}" min="0" max="100" step="0.1"></div><div><label class="lbl">Tax Type</label><select class="inp" id="cfg_taxType"><option value="exclusive" ${cfg.taxType==='exclusive'?'selected':''}>Exclusive (added to amount)</option><option value="inclusive" ${cfg.taxType==='inclusive'?'selected':''}>Inclusive (included in amount)</option></select></div></div><div class="mt-3 p-3 rounded-lg" style="background:var(--card2);border:1px solid var(--border)"><p class="text-xs" style="color:var(--text2)"><i class="fas fa-info-circle mr-1"></i>Tax settings will be applied to salary calculations and expense vouchers.</p></div></div>`}else if(adminTab==='att'){const attTypes=cfg.attendanceTypes||[{code:'P',label:'Present',color:'#10B981'},{code:'A',label:'Absent',color:'#EF4444'},{code:'H',label:'Half Day',color:'#F59E0B'},{code:'L',label:'Leave',color:'#06B6D4'}];html=`<div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-calendar-check mr-2" style="color:var(--accent)"></i>Attendance Rules</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3"><div><label class="lbl">Full Day Hours</label><input class="inp" type="number" id="cfg_fullHrs" value="${cfg.fullDayHours||8}" min="1" max="24"></div><div><label class="lbl">Half Day Hours</label><input class="inp" type="number" id="cfg_halfHrs" value="${cfg.halfDayHours||4}" min="1" max="12"></div><div><label class="lbl">Grace Period (minutes)</label><input class="inp" type="number" id="cfg_grace" value="${cfg.graceMinutes||15}" min="0"></div><div><label class="lbl">Weekend Day(s)</label><select class="inp" id="cfg_weekend" multiple style="height:90px"><option value="0" ${cfg.weekendDays?.includes(0)?'selected':''}>Sunday</option><option value="6" ${cfg.weekendDays?.includes(6)?'selected':''}>Saturday</option><option value="5" ${cfg.weekendDays?.includes(5)?'selected':''}>Friday</option></select></div></div><div class="mb-3"><label class="lbl mb-2">Overtime Settings</label><label class="perm-item checked mb-2" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);cursor:pointer"><input type="checkbox" id="cfg_otEn" ${cfg.overtimeEnabled?'checked':''}> <span>Enable Overtime Calculation</span></label><div><label class="lbl">Overtime Rate Multiplier</label><input class="inp" type="number" id="cfg_otRate" value="${cfg.overtimeRate||1.5}" min="1" step="0.1"></div></div><div><label class="lbl mb-2">Attendance Types</label><div class="tw"><table><thead><tr><th>Code</th><th>Label</th><th>Color</th></tr></thead><tbody>${attTypes.map(t=>`<tr><td class="font-bold text-center">${t.code}</td><td>${t.label}</td><td><span class="badge" style="background:${t.color}20;color:${t.color}">${t.color}</span></td></tr>`).join('')}</tbody></table></div></div></div>`}else if(adminTab==='pay'){const methods=cfg.paymentMethods||['Cash','Bank Transfer','Cheque'];html=`<div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-money-check mr-2" style="color:var(--accent)"></i>Payment Configuration</h3><div><label class="lbl mb-2">Payment Methods (one per line)</label><textarea class="inp" id="cfg_payMethods" rows="5" style="font-size:12.5px">${methods.join('\n')}</textarea></div><div class="mt-3"><label class="lbl">Salary Calculation Method</label><select class="inp" id="cfg_salMethod"><option value="attendance" ${cfg.salaryCalcMethod==='attendance'?'selected':''}>Based on Attendance</option><option value="fixed" ${cfg.salaryCalcMethod==='fixed'?'selected':''}>Fixed Monthly Salary</option><option value="daily" ${cfg.salaryCalcMethod==='daily'?'selected':''}>Daily Wage Based</option></select></div><div class="mt-3 p-3 rounded-lg" style="background:var(--card2);border:1px solid var(--border)"><p class="text-xs" style="color:var(--text2)"><i class="fas fa-info-circle mr-1"></i>Payment methods will appear in all payment voucher dropdowns across the system.</p></div></div>`}else if(adminTab==='mod'){const modules=[{k:'laborMaster',l:'Labor Master'},{k:'attendance',l:'Attendance'},{k:'workEntry',l:'Daily Work Entry'},{k:'overtime',l:'Overtime'},{k:'laborLedger',l:'Labor Ledger'},{k:'laborLoans',l:'Labor Loans'},{k:'monthlySalary',l:'Monthly Salary'},{k:'laborPayables',l:'Labor Payables'},{k:'wageSlip',l:'Wage Slip'},{k:'cashBook',l:'Cash Book'},{k:'serviceMaster',l:'Service Master'},{k:'itemMaster',l:'Item Master'},{k:'wageRates',l:'Wage Rates'},{k:'expCats',l:'Expense Categories'},{k:'rptLabor',l:'Labor Reports'},{k:'rptCash',l:'Cash Reports'},{k:'rptExpense',l:'Expense Reports'},{k:'auditLog',l:'Audit Log'},{k:'backup',l:'Backup & Restore'},{k:'settings',l:'Settings'},{k:'userMgmt',l:'User Management'},{k:'adminConfig',l:'Admin Configuration'}];html=`<div class="card mb-4"><h3 class="font-bold text-sm mb-3"><i class="fas fa-th-large mr-2" style="color:var(--accent)"></i>Module Access Control</h3><p class="text-xs mb-3" style="color:var(--text2)">Enable or disable modules. Disabled modules will be hidden from the navigation menu for all users.</p><div class="perm-grid">${modules.map(m=>`<label class="perm-item ${cfg.modules?.[m.k]!==false?'checked':''}"><input type="checkbox" value="${m.k}" ${cfg.modules?.[m.k]!==false?'checked':''}> <span><i class="fas fa-${m.k==='dashboard'?'th-large':m.k.includes('rpt')?'chart-bar':m.k.includes('labor')?'users':'box'} mr-1" style="font-size:10px"></i>${m.l}</span></label>`).join('')}</div><div class="mt-3 p-3 rounded-lg" style="background:var(--card2);border:1px solid var(--border)"><p class="text-xs" style="color:var(--text2)"><i class="fas fa-exclamation-triangle mr-1" style="color:var(--warn)"></i>Admin role always has access to all enabled modules regardless of individual permissions.</p></div></div>`}cont.innerHTML=html;document.querySelectorAll('#admin_config_content .perm-item').forEach(el=>{el.addEventListener('click',()=>{el.classList.toggle('checked');const inp=el.querySelector('input');if(inp)inp.checked=el.classList.contains('checked')})})};
window.saveAdminConfig=function(){const cfg=D.go('adminConfig');const updated={workingDaysPerMonth:+document.getElementById('cfg_workingDays')?.value||26,sessionTimeout:+document.getElementById('cfg_session')?.value||60,minPasswordLength:+document.getElementById('cfg_minPass')?.value||6,lowBalanceThreshold:+document.getElementById('cfg_lowBal')?.value||5000,currencyPosition:document.getElementById('cfg_curPos')?.value||'before',dateFormat:document.getElementById('cfg_dateFmt')?.value||'DD-MM-YYYY',enableNotifications:document.getElementById('cfg_notif')?.checked||false,autoMarkPresent:document.getElementById('cfg_autoPresent')?.checked||false,requireRemarks:document.getElementById('cfg_reqRemarks')?.checked||false,taxEnabled:document.getElementById('cfg_taxEn')?.checked||false,taxRate:+document.getElementById('cfg_taxRate')?.value||0,taxType:document.getElementById('cfg_taxType')?.value||'exclusive',fullDayHours:+document.getElementById('cfg_fullHrs')?.value||8,halfDayHours:+document.getElementById('cfg_halfHrs')?.value||4,graceMinutes:+document.getElementById('cfg_grace')?.value||15,overtimeEnabled:document.getElementById('cfg_otEn')?.checked||false,overtimeRate:+document.getElementById('cfg_otRate')?.value||1.5,weekendDays:Array.from(document.getElementById('cfg_weekend')?.selectedOptions||[]).map(o=>+o.value),paymentMethods:(document.getElementById('cfg_payMethods')?.value||'Cash').split('\n').map(m=>m.trim()).filter(m=>m),salaryCalcMethod:document.getElementById('cfg_salMethod')?.value||'attendance',attendanceTypes:cfg.attendanceTypes||[],modules:{}};document.querySelectorAll('#admin_config_content input[type="checkbox"][value]').forEach(c=>{updated.modules[c.value]=c.checked});D.so('adminConfig',updated);AU.log('Admin Configuration Updated','Tab: '+adminTab);N.s('Configuration saved successfully');APP.bNav();};
