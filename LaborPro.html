window.handleComboKey=function(e, id){
    const list=document.getElementById(id+'_list'); if(!list) return;
    if(list.style.display==='none'){
        if(e.key==='ArrowDown' || e.key==='Enter'){
            e.preventDefault(); showComboList(id);
            window.comboState[id]=0; highlightComboItem(id);
        }
        return;
    }
    const items=Array.from(list.querySelectorAll('.combo-item')).filter(it=>it.style.display!=='none');
    if(!items.length) return;
    let idx = window.comboState[id] !== undefined ? window.comboState[id] : 0;
    if(e.key==='ArrowDown'){
        e.preventDefault();
        idx = (idx + 1) % items.length;
        window.comboState[id] = idx;
        highlightComboItem(id, items);
    } else if(e.key==='ArrowUp'){
        e.preventDefault();
        idx = (idx - 1 + items.length) % items.length;
        window.comboState[id] = idx;
        highlightComboItem(id, items);
    } else if(e.key==='Enter'){
        e.preventDefault();
        if(items[idx]) {
            const val = items[idx].getAttribute('data-val');
            const name = items[idx].getAttribute('data-name');
            if(val && name) selectCombo(id, val, name);
        }
    } else if(e.key==='Escape'){
        e.preventDefault();
        hideComboList(id);
    }
};
window.highlightComboItem=function(id, items){
    if(!items){
        const list=document.getElementById(id+'_list'); if(!list) return;
        items=Array.from(list.querySelectorAll('.combo-item')).filter(it=>it.style.display!=='none');
    }
    const idx = window.comboState[id] || 0;
    items.forEach((it, i)=>{
        if(i === idx){
            it.classList.add('combo-active');
            it.scrollIntoView({block:'nearest'});
        } else {
            it.classList.remove('combo-active');
        }
    });
};
window.filterCombo=function(id, q) {
    const list = document.getElementById(id+'_list'); if(!list) return;
    const items = list.querySelectorAll('.combo-item');
    q = q.toLowerCase();
    items.forEach(it => { it.style.display = it.textContent.toLowerCase().includes(q) ? 'block' : 'none'; });
    window.comboState[id] = 0;
    highlightComboItem(id);
};
window.showComboList=function(id) { const list = document.getElementById(id+'_list'); if(list) list.style.display='block'; };
window.hideComboList=function(id) { setTimeout(()=>{const list = document.getElementById(id+'_list'); if(list) list.style.display='none';}, 150); };
window.selectCombo=function(id, val, name) {
    const hidden = document.getElementById(id); const txt = document.getElementById(id+'_txt');
    if(hidden) hidden.value = val; if(txt) txt.value = name;
    const list = document.getElementById(id+'_list'); if(list) list.style.display='none';
    if(window.comboCallbacks[id]) {
        const cb = window.comboCallbacks[id];
        if (typeof cb === 'string') window[cb](); else if (typeof cb === 'function') cb();
    }
};

function mp(cfg){const items=D.g(cfg.k);return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black">${cfg.t}</h1><p class="text-xs" style="color:var(--text2)">${items.length} records</p></div><div class="flex gap-2 flex-wrap no-print"><div class="sg"><i class="fas fa-search"></i><input class="inp" placeholder="Search..." onkeyup="mf('${cfg.k}',this.value)" style="font-size:11.5px;padding:6px 10px 6px 32px;width:180px"></div><button class="btn btn-p" onclick="${cfg.af}()"><i class="fas fa-plus"></i> Add</button><button class="btn btn-s" onclick="expM('${cfg.k}','${cfg.t}')"><i class="fas fa-download"></i></button></div></div><div class="tw" id="tb_${cfg.k}"><table><thead><tr>${cfg.c.map(x=>`<th>${x}</th>`).join('')}<th class="no-print" style="width:100px">Actions</th></tr></thead><tbody>${items.length?items.map(cfg.rf).join(''):`<tr><td colspan="${cfg.c.length+1}" class="text-center py-8" style="color:var(--text2)"><i class="fas fa-inbox text-2xl mb-2 block opacity:25"></i>No records</td></tr>`}</tbody></table></div>`}
function mf(k,q){document.querySelectorAll(`#tb_${k} tbody tr`).forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function expM(k,t){const items=D.g(k);if(!items.length){N.w('No data');return}const h=Object.keys(items[0]).filter(x=>!['ct','ut','hist','deductions'].includes(x));U.csv(t+'.csv',h,items.map(i=>h.map(x=>i[x]??'')));N.s('Exported')}
function ab(ef,df,x=''){return`<td class="no-print"><div class="flex gap-1">${x}<button class="btn btn-s" style="padding:3px 7px" onclick="${ef}" title="Edit"><i class="fas fa-edit" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="${df}" title="Delete"><i class="fas fa-trash" style="font-size:10px"></i></button></div></td>`}

PG.laborMaster=function(){return mp({k:'labors',t:'Labor Master',c:['ID','Name','Department','Father Name','CNIC','Mobile','Salary','Status'],af:'showLF',rf:l=>`<tr><td class="font-semibold">#${l.id}</td><td class="font-semibold">${l.name}</td><td><span class="badge bg-i">${l.dept||'-'}</span></td><td>${l.father||''}</td><td class="text-xs">${l.cnic||''}</td><td class="text-xs">${l.mobile||''}</td><td class="text-xs font-bold" style="color:var(--accent)">${U.fc(l.salary||0)}</td><td><span class="badge ${l.status==='Active'?'bg-s':'bg-d'}">${l.status}</span></td>${ab(`showLF(${l.id})`,`delL(${l.id})`,`<button class="btn btn-s" style="padding:3px 7px" onclick="viewLL(${l.id})" title="Ledger"><i class="fas fa-book" style="font-size:10px"></i></button>`)}</tr>`})};
window.showLF=function(id){const l=id?D.f('labors',id):{};mdl(id?'Edit Labor':'Add Labor',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="sm:col-span-2"><label class="lbl">Name *</label><input class="inp" id="f_ln" value="${l.name||''}"></div><div><label class="lbl">Department</label><input class="inp" id="f_ld" value="${l.dept||''}" placeholder="e.g. Welding, Grinding, Linking"></div><div><label class="lbl">Monthly Salary</label><input class="inp" type="number" id="f_lsal" value="${l.salary||0}" min="0"></div><div><label class="lbl">Father Name</label><input class="inp" id="f_lf" value="${l.father||''}"></div><div><label class="lbl">CNIC</label><input class="inp" id="f_lc" value="${l.cnic||''}"></div><div><label class="lbl">Mobile</label><input class="inp" id="f_lm" value="${l.mobile||''}"></div><div><label class="lbl">Join Date</label><input class="inp" type="date" id="f_lj" value="${l.join||U.td()}"></div><div class="sm:col-span-2"><label class="lbl">Address</label><input class="inp" id="f_la" value="${l.addr||''}"></div><div><label class="lbl">Status</label><select class="inp" id="f_ls"><option value="Active" ${l.status==='Active'?'selected':''}>Active</option><option value="Inactive" ${l.status==='Inactive'?'selected':''}>Inactive</option></select></div><div><label class="lbl">Notes</label><input class="inp" id="f_lt" value="${l.notes||''}"></div></div>`, vf('saveL', id, 'labors', 'showLF'))};
window.saveL=function(id, isNew){const n=document.getElementById('f_ln').value.trim();if(!n){N.e('Name required');return}const d={name:n,dept:document.getElementById('f_ld').value.trim(),father:document.getElementById('f_lf').value.trim(),cnic:document.getElementById('f_lc').value.trim(),mobile:document.getElementById('f_lm').value.trim(),salary:+document.getElementById('f_lsal').value||0,join:document.getElementById('f_lj').value,addr:document.getElementById('f_la').value.trim(),status:document.getElementById('f_ls').value,notes:document.getElementById('f_lt').value.trim()};if(id){D.upd('labors',id,d);AU.log('Edit Labor',n)}else{D.add('labors',d);AU.log('Add Labor',n)}N.s(id?'Updated':'Added');if(isNew){showLF()}else{cmod();APP.go('laborMaster')}};
window.delL=function(id){const l=D.f('labors',id);cfm(`Delete "${l.name}"?`,()=>{D.rm('labors',id);AU.log('Delete Labor',l.name);N.s('Deleted');APP.go('laborMaster')})};
window.viewLL=function(id){APP.go('laborLedger');setTimeout(()=>{const l=D.f('labors',id);if(l){document.getElementById('llf').value=id;document.getElementById('llf_txt').value=l.name;fll();}},200)};

PG.laborLoans=function(){const lb=D.g('labors');const r=D.g('loans').sort((a,b)=>b.date.localeCompare(a.date));const totalOut=r.reduce((s,l)=>s+(l.amount-(l.deducted||0)),0);return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-hand-holding-usd mr-2" style="color:var(--info)"></i>Labor Long-Term Loans</h1><p class="text-xs" style="color:var(--text2)">Total Outstanding: <strong style="color:var(--error)">${U.fc(totalOut)}</strong></p></div><div class="flex gap-2 no-print"><button class="btn btn-s" onclick="expM('loans','Labor_Loans')"><i class="fas fa-download"></i></button><button class="btn btn-p" onclick="showLoanF()"><i class="fas fa-plus"></i> New Loan</button></div></div><div class="card mb-4 no-print"><div class="flex flex-wrap gap-3 items-end"><div><label class="lbl">Select Labor for Ledger</label>${genCombo('loanLedgerFilter', lb.map(l=>({id:l.id,name:l.name})), null, 'renderLoanLedger')}</div></div></div><div id="loanLedgerContent">${renderLoansOverview(r)}</div>`};
window.renderLoanLedger=function(){const lid=+document.getElementById('loanLedgerFilter').value;const c=document.getElementById('loanLedgerContent');if(!lid){const r=D.g('loans').sort((a,b)=>b.date.localeCompare(a.date));c.innerHTML=renderLoansOverview(r);return}c.innerHTML=renderLaborLoanLedger(lid)};
function renderLoansOverview(r){return `<div class="tw"><table><thead><tr><th>Date</th><th>Labor</th><th>Amount</th><th>Deducted</th><th>Outstanding</th><th>Remarks</th><th class="no-print">Actions</th></tr></thead><tbody>${r.length?r.map(l=>{const out=l.amount-(l.deducted||0);return `<tr><td class="text-xs">${U.fd(l.date)}</td><td class="font-semibold">${U.ln(l.lid)}</td><td class="font-bold" style="color:var(--info)">${U.fc(l.amount)}</td><td class="text-xs" style="color:var(--success)">${U.fc(l.deducted||0)}</td><td class="font-bold" style="color:var(--error)">${U.fc(out)}</td><td class="text-xs" style="color:var(--text2)">${l.rem||''}</td><td class="no-print"><div class="flex gap-1"><button class="btn btn-s" style="padding:3px 7px" onclick="deductLoan(${l.id})" title="Deduct"><i class="fas fa-minus" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="cfm('Delete loan?',()=>{D.rm('loans',${l.id});N.s('Deleted');APP.go('laborLoans')})"><i class="fas fa-trash" style="font-size:10px"></i></button></div></td></tr>`}).join(''):'<tr><td colspan="7" class="text-center py-8" style="color:var(--text2)">No loans</td></tr>'}</tbody></table></div>`};
function renderLaborLoanLedger(lid){const l=D.f('labors',lid);if(!l)return'';const loans=D.g('loans').filter(x=>x.lid===lid).sort((a,b)=>a.date.localeCompare(b.date));let entries=[];loans.forEach(ln=>{entries.push({date:ln.date,desc:`Loan Given - ${ln.rem||''}`,debit:ln.amount,credit:0,vno:'LOAN-'+ln.id});const deductions=ln.deductions||[];deductions.forEach(d=>{entries.push({date:d.date,desc:`Loan Deduction - ${ln.rem||''}`,debit:0,credit:d.amount,vno:'LOAN-'+ln.id+'-DED'})})});entries.sort((a,b)=>a.date.localeCompare(b.date));let bal=0;const rows=entries.map(e=>{bal+=e.debit-e.credit;return `<tr><td class="text-xs">${U.fd(e.date)}</td><td class="text-xs font-mono">${e.vno}</td><td class="text-xs">${e.desc}</td><td class="text-right text-xs" style="color:var(--info)">${e.debit?U.fc(e.debit):'-'}</td><td class="text-right text-xs" style="color:var(--success)">${e.credit?U.fc(e.credit):'-'}</td><td class="text-right text-xs font-bold" style="color:${bal>=0?'var(--accent)':'var(--error)'}">${U.fc(bal)}</td></tr>`}).join('');const totalDebit=entries.reduce((s,e)=>s+e.debit,0);const totalCredit=entries.reduce((s,e)=>s+e.credit,0);const balance=totalDebit-totalCredit;return `<div class="card mb-4"><div class="flex items-center gap-4 flex-wrap"><div class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-lg" style="background:var(--info);color:#000">${l.name[0]}</div><div><div class="font-bold">${l.name}</div><div class="text-xs" style="color:var(--text2)">${l.mobile||''} | Joined: ${U.fd(l.join)}</div></div><div class="ml-auto flex gap-4"><div class="text-right"><div class="text-xs" style="color:var(--text2)">Total Loans (Debit)</div><div class="font-bold" style="color:var(--info)">${U.fc(totalDebit)}</div></div><div class="text-right"><div class="text-xs" style="color:var(--text2)">Total Deducted (Credit)</div><div class="font-bold" style="color:var(--success)">${U.fc(totalCredit)}</div></div><div class="text-right"><div class="text-xs" style="color:var(--text2)">Outstanding Balance</div><div class="font-bold" style="color:var(--error)">${U.fc(balance)}</div></div></div></div></div><div class="tw"><table><thead><tr><th>Date</th><th>Voucher</th><th>Description</th><th class="text-right">Debit</th><th class="text-right">Credit</th><th class="text-right">Balance</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="text-center py-8" style="color:var(--text2)">No loan entries</td></tr>'}<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">Totals / Closing Balance:</td><td class="text-right font-bold" style="color:var(--info)">${U.fc(totalDebit)}</td><td class="text-right font-bold" style="color:var(--success)">${U.fc(totalCredit)}</td><td class="text-right font-black" style="color:var(--error)">${U.fc(balance)}</td></tr></tbody></table></div>`}
window.showLoanF=function(id){const lb=D.g('labors').filter(l=>l.status==='Active');const l=id?D.f('loans',id):{};mdl(id?'Edit Loan':'New Labor Loan',`<div class="space-y-3"><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_ld" value="${l.date||U.td()}"></div><div><label class="lbl">Labor *</label>${genCombo('f_ll', lb.map(l=>({id:l.id,name:l.name})), l.lid)}</div><div><label class="lbl">Loan Amount *</label><input class="inp" type="number" id="f_la" min="0" value="${l.amount||''}"></div><div><label class="lbl">Remarks</label><input class="inp" id="f_lr" value="${l.rem||''}" placeholder="Optional"></div></div>`, vf('saveLoan', id, 'loans', 'showLoanF'))};
window.saveLoan=function(id, isNew){const d=document.getElementById('f_ld').value,lid=+document.getElementById('f_ll').value,amt=+document.getElementById('f_la').value;if(!d||!lid||!amt){N.e('Fill required fields');return}if(id){D.upd('loans',id,{date:d,lid,amount:amt,rem:document.getElementById('f_lr').value.trim()})}else{D.add('loans',{date:d,lid,amount:amt,deducted:0,rem:document.getElementById('f_lr').value.trim(),deductions:[]})}AU.log('Add Loan',U.ln(lid)+' '+U.fc(amt));N.s('Loan saved');if(isNew){showLoanF()}else{cmod();APP.go('laborLoans')}};
window.deductLoan=function(id){const l=D.f('loans',id);if(!l)return;const out=l.amount-(l.deducted||0);mdl('Deduct Loan — '+U.ln(l.lid),`<div class="space-y-3"><div class="text-xs p-3 rounded-lg" style="background:var(--card2)">Outstanding Balance: <strong style="color:var(--error)">${U.fc(out)}</strong></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_dd" value="${U.td()}"></div><div><label class="lbl">Deduction Amount *</label><input class="inp" type="number" id="f_da" min="0" max="${out}"></div><div class="text-xs p-2 rounded-lg" style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--success)"><i class="fas fa-info-circle mr-1"></i>This deduction will automatically create a "Cash Received" entry in the Cash Book.</div></div>`, `<button class="btn btn-s" onclick="cmod()">Cancel</button><button class="btn btn-p" onclick="saveDeduct(${id})">Deduct</button>`)};
window.saveDeduct=function(id){const l=D.f('loans',id);if(!l)return;const amt=+document.getElementById('f_da').value;const ddate=document.getElementById('f_dd')?document.getElementById('f_dd').value:U.td();const out=l.amount-(l.deducted||0);if(!amt||amt<1||amt>out){N.e('Invalid amount. Max: '+out);return}const crEntry=D.add('cashReceived',{date:ddate,vno:U.vno('REC'),from:U.ln(l.lid),cat:'Loan Repayment',am:amt,method:'Cash',ref:'LOAN-'+l.id,desc:'Loan deduction - '+(l.rem||'')});const deductions=l.deductions||[];deductions.push({date:ddate,amount:amt,crId:crEntry.id});D.upd('loans',id,{deducted:(l.deducted||0)+amt,deductions:deductions});AU.log('Loan Deduction',U.ln(l.lid)+' -'+U.fc(amt)+' (Cash Received entry created)');N.s('Deducted successfully! Cash Received entry created in Cash Book.');cmod();APP.go('laborLoans')};

PG.serviceMaster=function(){return mp({k:'services',t:'Service Master',c:['ID','Name','Description','Status'],af:'showSF',rf:s=>`<tr><td>#${s.id}</td><td class="font-semibold">${s.name}</td><td class="text-xs" style="color:var(--text2)">${s.desc||''}</td><td><span class="badge ${s.active?'bg-s':'bg-d'}">${s.active?'Active':'Inactive'}</span></td>${ab(`showSF(${s.id})`,`delS(${s.id})`)}</tr>`})};
window.showSF=function(id){const s=id?D.f('services',id):{};mdl(id?'Edit Service':'Add Service',`<div class="space-y-3"><div><label class="lbl">Name *</label><input class="inp" id="f_sn" value="${s.name||''}"></div><div><label class="lbl">Description</label><input class="inp" id="f_sd" value="${s.desc||''}"></div><div><label class="lbl">Status</label><select class="inp" id="f_sa"><option value="true" ${s.active!==false?'selected':''}>Active</option><option value="false" ${s.active===false?'selected':''}>Inactive</option></select></div></div>`, vf('saveS', id, 'services', 'showSF'))};
window.saveS=function(id, isNew){const n=document.getElementById('f_sn').value.trim();if(!n){N.e('Name required');return}const d={name:n,desc:document.getElementById('f_sd').value.trim(),active:document.getElementById('f_sa').value==='true'};if(id)D.upd('services',id,d);else D.add('services',d);AU.log(id?'Edit Service':'Add Service',n);N.s('Saved');if(isNew){showSF()}else{cmod();APP.go('serviceMaster')}};
window.delS=function(id){cfm('Delete this service?',()=>{D.rm('services',id);N.s('Deleted');APP.go('serviceMaster')})};

PG.itemMaster=function(){return mp({k:'items',t:'Item Master',c:['Code','Name','Category','Unit'],af:'showIF',rf:i=>`<tr><td class="font-semibold text-xs">${i.code}</td><td class="font-semibold">${i.name}</td><td><span class="badge bg-i">${i.cat||''}</span></td><td class="text-xs">${i.unit}</td>${ab(`showIF(${i.id})`,`delI(${i.id})`)}</tr>`})};
window.showIF=function(id){const i=id?D.f('items',id):{};mdl(id?'Edit Item':'Add Item',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Code *</label><input class="inp" id="f_ic" value="${i.code||''}"></div><div><label class="lbl">Name *</label><input class="inp" id="f_in" value="${i.name||''}"></div><div><label class="lbl">Category</label><input class="inp" id="f_ia" value="${i.cat||''}"></div><div><label class="lbl">Unit</label><select class="inp" id="f_iu"><option ${i.unit==='Pcs'?'selected':''}>Pcs</option><option ${i.unit==='Kg'?'selected':''}>Kg</option><option ${i.unit==='Meter'?'selected':''}>Meter</option><option ${i.unit==='Set'?'selected':''}>Set</option></select></div></div>`, vf('saveI', id, 'items', 'showIF'))};
window.saveI=function(id, isNew){const c=document.getElementById('f_ic').value.trim(),n=document.getElementById('f_in').value.trim();if(!c||!n){N.e('Code and name required');return}const d={code:c,name:n,cat:document.getElementById('f_ia').value.trim(),unit:document.getElementById('f_iu').value};if(id)D.upd('items',id,d);else D.add('items',d);AU.log(id?'Edit Item':'Add Item',n);N.s('Saved');if(isNew){showIF()}else{cmod();APP.go('itemMaster')}};
window.delI=function(id){cfm('Delete this item?',()=>{D.rm('items',id);N.s('Deleted');APP.go('itemMaster')})};

PG.wageRates=function(){const r=D.g('wageRates');return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black">Wage Rate Master</h1><p class="text-xs" style="color:var(--text2)">${r.length} rates</p></div><button class="btn btn-p no-print" onclick="showWF()"><i class="fas fa-plus"></i> Add Rate</button></div><div class="tw"><table><thead><tr><th>Item</th><th>Service</th><th>Rate</th><th class="no-print">Actions</th></tr></thead><tbody>${r.length?r.map(w=>`<tr><td class="font-semibold">${U.in(w.iid)}</td><td>${U.sn(w.sid)}</td><td class="font-bold" style="color:var(--accent)">${U.fc(w.rate)}</td><td class="no-print"><div class="flex gap-1"><button class="btn btn-s" style="padding:3px 7px" onclick="showWF(${w.id})"><i class="fas fa-edit" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="cfm('Delete rate?',()=>{D.rm('wageRates',${w.id});N.s('Deleted');APP.go('wageRates')})"><i class="fas fa-trash" style="font-size:10px"></i></button></div></td></tr>`).join(''):'<tr><td colspan="4" class="text-center py-8" style="color:var(--text2)">No rates</td></tr>'}</tbody></table></div>`};
window.showWF=function(id){const w=id?D.f('wageRates',id):{},it=D.g('items'),sv=D.g('services').filter(s=>s.active);mdl(id?'Edit Rate':'Add Rate',`<div class="space-y-3"><div><label class="lbl">Item *</label>${genCombo('f_wi', it.map(i=>({id:i.id,name:i.name})), w.iid)}</div><div><label class="lbl">Service *</label>${genCombo('f_ws', sv.map(s=>({id:s.id,name:s.name})), w.sid)}</div><div><label class="lbl">Rate *</label><input class="inp" type="number" id="f_wr" value="${w.rate||''}" min="0"></div></div>`, vf('saveW', id, 'wageRates', 'showWF'))};
window.saveW=function(id, isNew){const iid=+document.getElementById('f_wi').value,sid=+document.getElementById('f_ws').value,rate=+document.getElementById('f_wr').value;if(isNaN(rate)||rate<0){N.e('Valid rate required');return}if(D.g('wageRates').find(r=>r.iid===iid&&r.sid===sid&&r.id!==id)){N.e('Rate exists for this combo');return}if(id){const old=D.f('wageRates',id);const h=old.hist||[];h.push({rate:old.rate,date:U.td()});D.upd('wageRates',id,{iid,sid,rate,hist:h})}else D.add('wageRates',{iid,sid,rate,hist:[]});AU.log(id?'Edit Wage Rate':'Add Wage Rate');N.s('Saved');if(isNew){showWF()}else{cmod();APP.go('wageRates')}};

PG.workEntry=function(){const we=D.g('workEntries').sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black">Daily Work Entry</h1><p class="text-xs" style="color:var(--text2)">${we.length} entries</p></div><div class="flex gap-2 no-print flex-wrap items-end"><div><label class="lbl">From Date</label><input class="inp" type="date" id="wef" value="${U.ms()}" onchange="fwe()" style="font-size:11.5px;width:140px"></div><div><label class="lbl">To Date</label><input class="inp" type="date" id="wet" value="${U.td()}" onchange="fwe()" style="font-size:11.5px;width:140px"></div><button class="btn btn-p" onclick="showWEF()"><i class="fas fa-plus"></i> New</button><button class="btn btn-s" onclick="expM('workEntries','Work_Entries')"><i class="fas fa-download"></i></button></div></div><div class="tw"><table><thead><tr><th>Voucher No</th><th>Date</th><th>Labor</th><th>Item</th><th>Service</th><th>Qty</th><th>Rate</th><th>Amount</th><th class="no-print">Actions</th></tr></thead><tbody id="web">${we.slice(0,80).map(e=>`<tr data-d="${e.date}"><td class="text-xs font-mono">${e.vno||'WE-'+e.id}</td><td class="text-xs">${U.fd(e.date)}</td><td class="font-semibold">${U.ln(e.lid)}</td><td>${U.in(e.iid)}</td><td>${U.sn(e.sid)}</td><td class="text-center">${e.qty}</td><td class="text-right">${U.fc(e.rate)}</td><td class="text-right font-bold" style="color:var(--accent)">${U.fc(e.amt)}</td><td class="no-print"><div class="flex gap-1"><button class="btn btn-s" style="padding:3px 7px" onclick="showWEF(${e.id})"><i class="fas fa-edit" style="font-size:10px"></i></button><button class="btn btn-s" style="padding:3px 7px" onclick="dupWE(${e.id})" title="Duplicate"><i class="fas fa-copy" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="cfm('Delete entry?',()=>{D.rm('workEntries',${e.id});N.s('Deleted');APP.go('workEntry')})"><i class="fas fa-trash" style="font-size:10px"></i></button></div></td></tr>`).join('')||'<tr><td colspan="9" class="text-center py-8" style="color:var(--text2)">No entries</td></tr>'}</tbody></table></div>`};

window.showWEF=function(id){const e=id?D.f('workEntries',id):{},lb=D.g('labors').filter(l=>l.status==='Active'),it=D.g('items'),sv=D.g('services').filter(s=>s.active);mdl(id?'Edit Entry':'New Work Entry',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Voucher No</label><input class="inp" id="f_wevno" value="${e.vno||U.vno('WE')}" readonly style="background:var(--card2)"></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_wed" value="${e.date||U.td()}"></div><div><label class="lbl">Labor *</label>${genCombo('f_wel', lb.map(l=>({id:l.id,name:l.name})), e.lid)}</div><div><label class="lbl">Item *</label>${genCombo('f_wei', it.map(i=>({id:i.id,name:i.name})), e.iid, 'weRate')}</div><div><label class="lbl">Service *</label>${genCombo('f_wes', sv.map(s=>({id:s.id,name:s.name})), e.sid, 'weRate')}</div><div><label class="lbl">Quantity *</label><input class="inp" type="number" id="f_weq" value="${e.qty||1}" min="1" oninput="weCalc()"></div><div><label class="lbl">Rate</label><input class="inp" type="number" id="f_wer" value="${e.rate||''}" oninput="weCalc()"></div><div><label class="lbl">Amount</label><input class="inp" id="f_wea" value="${e.amt||''}" readonly style="background:var(--card2);font-weight:700;color:var(--accent)"></div><div class="sm:col-span-2"><label class="lbl">Remarks</label><input class="inp" id="f_werem" value="${e.rem||''}"></div></div>`, vf('saveWE', id, 'workEntries', 'showWEF'));if(id)weCalc()};

window.fot=function(){const f=document.getElementById('otf').value;const t=document.getElementById('ott').value;document.querySelectorAll('#otb tr').forEach(r=>{const d=r.dataset.d;let show=true;if(f&&d<f)show=false;if(t&&d>t)show=false;r.style.display=show?'':'none'})};
window.showOTF=function(id){
  const e=id?D.f('overtime',id):{},lb=D.g('labors').filter(l=>l.status==='Active'),cfg=D.go('adminConfig'),defaultMult=cfg.overtimeRate||1.5;
  mdl(id?'Edit Overtime':'New Overtime Entry',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div><label class="lbl">Voucher No</label><input class="inp" id="f_otvno" value="${e.vno||U.vno('OT')}" readonly style="background:var(--card2)"></div>

    <div><label class="lbl">Labor *</label>${genCombo('f_otl', lb.map(l=>({id:l.id,name:l.name})), e.lid, 'otRate')}</div>
    <div><label class="lbl">Overtime Hours *</label><input class="inp" type="number" id="f_oth" value="${e.hours||1}" min="0.5" step="0.5" oninput="otCalc()"></div>
    <div><label class="lbl">Hourly Rate</label><input class="inp" type="number" id="f_otr" value="${e.rate||''}" oninput="otCalc()" step="0.01"></div>

    <div class="sm:col-span-2"><div class="text-xs p-2 rounded-lg" style="background:var(--card2)"><i class="fas fa-info-circle mr-1" style="color:var(--info)"></i> Hourly rate auto-calculated from labor salary. Override manually if needed. Amount = Hours &times; Rate &times; Multiplier.</div></div>
  </div>`, vf('saveOT', id, 'overtime', 'showOTF'));
  if(!id&&lb.length){setTimeout(()=>{otRate()},100)}
};
window.otRate=function(){const lid=+document.getElementById('f_otl').value;if(lid){const rate=U.otHourlyRate(lid);document.getElementById('f_otr').value=rate}otCalc()};
window.otCalc=function(){const h=+document.getElementById('f_oth').value||0;const r=+document.getElementById('f_otr').value||0;const m=+document.getElementById('f_otm').value||1;document.getElementById('f_ota').value=(h*r*m).toFixed(2)};
window.saveOT=function(id, isNew){
  const d=document.getElementById('f_otd').value,lid=+document.getElementById('f_otl').value,h=+document.getElementById('f_oth').value,r=+document.getElementById('f_otr').value||0,m=+document.getElementById('f_otm').value||1.5,vno=document.getElementById('f_otvno').value;
  if(!d||!lid||!h||h<=0){N.e('Fill all required fields');return}
  const amt=Math.round(h*r*m*100)/100;
  const data={date:d,vno,lid,hours:h,rate:r,multiplier:m,amt,rem:document.getElementById('f_otrem').value.trim()};
  if(id){D.upd('overtime',id,data);AU.log('Edit Overtime',U.ln(lid)+' '+U.fc(amt))}else{D.add('overtime',data);AU.log('Add Overtime',U.ln(lid)+' '+U.fc(amt))}
  N.s('Saved');if(isNew){showOTF()}else{cmod();APP.go('overtime')}
};

PG.laborLedger=function(){const lb=D.g('labors');return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black">Labor Ledger</h1></div><div class="flex gap-2 no-print flex-wrap items-end"><div><label class="lbl">Labor</label>${genCombo('llf', lb.map(l=>({id:l.id,name:l.name})), null, 'fll')}</div><div><label class="lbl">From Date</label><input class="inp" type="date" id="llf_date" value="${U.ms()}" onchange="fll()" style="font-size:11.5px;width:140px"></div><div><label class="lbl">To Date</label><input class="inp" type="date" id="llt_date" value="${U.td()}" onchange="fll()" style="font-size:11.5px;width:140px"></div><button class="btn btn-s" onclick="expLL()"><i class="fas fa-download"></i></button></div></div><div id="llc"><div class="empty"><i class="fas fa-book"></i><p>Select a labor to view ledger</p></div></div>`};
window.fll=function(){const lid=+document.getElementById('llf').value;const f=document.getElementById('llf_date').value;const t=document.getElementById('llt_date').value;const c=document.getElementById('llc');if(!lid){c.innerHTML='<div class="empty"><i class="fas fa-book"></i><p>Select a labor</p></div>';return}const l=D.f('labors',lid),we=D.g('workEntries').filter(e=>e.lid===lid&&(!f||e.date>=f)&&(!t||e.date<=t)),py=D.g('payments').filter(e=>e.lid===lid&&(!f||e.date>=f)&&(!t||e.date<=t)),ot=D.g('overtime').filter(e=>e.lid===lid&&(!f||e.date>=f)&&(!t||e.date<=t));const totalQty=we.reduce((s,e)=>s+e.qty,0);const totalOT=ot.reduce((s,e)=>s+e.amt,0);const totalDebit=py.reduce((s,e)=>s+e.am,0);const totalCredit=we.reduce((s,e)=>s+e.amt,0)+totalOT;const balance=totalCredit-totalDebit;c.innerHTML=`<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Qty</div><div class="text-lg font-black" style="color:var(--info)">${U.fm(totalQty)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Overtime</div><div class="text-lg font-black" style="color:var(--warn)">${U.fc(totalOT)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Total Debit</div><div class="text-lg font-black" style="color:var(--error)">${U.fc(totalDebit)}</div></div><div class="card stat-card"><div class="text-xs" style="color:var(--text2)">Balance</div><div class="text-lg font-black" style="color:${balance>=0?'var(--accent)':'var(--error)'}">${U.fc(balance)}</div></div></div><div class="card mb-4"><div class="flex items-center gap-4 flex-wrap"><div class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-lg" style="background:var(--accent);color:#000">${l.name[0]}</div><div><div class="font-bold">${l.name}</div><div class="text-xs" style="color:var(--text2)">${l.mobile||''} | Joined: ${U.fd(l.join)}</div></div></div></div><div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Qty</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>${[...we.map(e=>({date:e.date,type:'Work',det:`${U.in(e.iid)} - ${U.sn(e.sid)} x${e.qty}`,qty:e.qty,dr:0,cr:e.amt})),...ot.map(o=>({date:o.date,type:'Overtime',det:`OT ${o.hours}hrs @ ${o.multiplier}x`,qty:0,dr:0,cr:o.amt})),...py.map(p=>({date:p.date,type:'Payment',det:p.rem||p.method,qty:0,dr:p.am,cr:0}))].sort((a,b)=>a.date.localeCompare(b.date)).reduce((arr,e)=>{const prev=arr.length?arr[arr.length-1].bal:0;arr.push({...e,bal:prev+e.cr-e.dr});return arr},[]).map(r=>`<tr><td class="text-xs">${U.fd(r.date)}</td><td><span class="badge ${r.type==='Work'?'bg-s':r.type==='Overtime'?'bg-w':'bg-d'}">${r.type}</span></td><td class="text-xs">${r.det}</td><td class="text-center text-xs">${r.qty>0?r.qty:'-'}</td><td class="text-right">${r.dr?U.fc(r.dr):'-'}</td><td class="text-right">${r.cr?U.fc(r.cr):'-'}</td><td class="text-right font-bold" style="color:${r.bal>=0?'var(--accent)':'var(--error)'}">${U.fc(r.bal)}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center py-8" style="color:var(--text2)">No entries</td></tr>'}</tbody></table></div>`};

PG.cashBook=function(){return `<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-cash-register mr-2" style="color:var(--accent)"></i>Cash Book</h1><p class="text-xs" style="color:var(--text2)">Opening: <strong id="cb_open_lbl">0</strong> | Closing: <strong style="color:var(--accent)" id="cb_close_lbl">0</strong></p></div><div class="flex gap-2 no-print flex-wrap items-end"><div><label class="lbl">From Date</label><input class="inp" type="date" id="cb_from" onchange="renderCB()" style="font-size:11.5px;width:140px"></div><div><label class="lbl">To Date</label><input class="inp" type="date" id="cb_to" value="${U.td()}" onchange="renderCB()" style="font-size:11.5px;width:140px"></div><button class="btn btn-p" onclick="showCRF()"><i class="fas fa-arrow-down"></i> Received</button><button class="btn btn-d" onclick="showNewCashPayment()"><i class="fas fa-arrow-up"></i> Payment</button><button class="btn btn-s" onclick="window.print()"><i class="fas fa-print"></i> Print</button></div></div><div id="cb_container"></div>`};
PG.cashBookI=function(){const ym=U.ms().slice(0,7);document.getElementById('cb_from').value=ym+'-01';renderCB()};
window.renderCB=function(){const from=document.getElementById('cb_from')?.value;const to=document.getElementById('cb_to')?.value;const st=D.go('settings');const sysOb=st.openingBal||0;let allTxns=[];D.g('cashReceived').forEach(r=>allTxns.push({id:r.id,date:r.date,vno:r.vno,desc:`From: ${r.from} - ${r.desc||''}`,debit:r.am,credit:0,type:'cr'}));D.g('cashPaid').forEach(p=>allTxns.push({id:p.id,date:p.date,vno:p.vno,desc:`To: ${p.to} - ${p.desc||''}`,debit:0,credit:p.am,type:'cp'}));D.g('expenses').forEach(e=>allTxns.push({id:e.id,date:e.date,vno:e.vno,desc:`Exp: ${U.cn(e.cid)} - ${e.to}`,debit:0,credit:e.am,type:'exp'}));D.g('payments').forEach(p=>allTxns.push({id:p.id,date:p.date,vno:p.vno,desc:`Pay: ${U.ln(p.lid)} - ${p.rem||''}`,debit:0,credit:p.am,type:'pay'}));let openingBal=sysOb;allTxns.forEach(t=>{if(!from||t.date<from){openingBal+=(t.debit-t.credit)}});let periodTxns=allTxns.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to));periodTxns.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);let currentBal=openingBal;let totalDebit=0,totalCredit=0;const processedTxns=periodTxns.map(t=>{currentBal+=(t.debit-t.credit);totalDebit+=t.debit;totalCredit+=t.credit;return{...t,runningBal:currentBal}});processedTxns.reverse();const closingBal=openingBal+totalDebit-totalCredit;document.getElementById('cb_open_lbl').textContent=U.fc(openingBal);document.getElementById('cb_close_lbl').textContent=U.fc(closingBal);const rows=processedTxns.map(t=>`<tr><td class="text-xs">${U.fd(t.date)}</td><td class="text-xs font-mono">${t.vno}</td><td class="text-xs">${t.desc}</td><td class="text-right text-xs" style="color:var(--success)">${t.debit?U.fc(t.debit):'-'}</td><td class="text-right text-xs" style="color:var(--error)">${t.credit?U.fc(t.credit):'-'}</td><td class="text-right text-xs font-bold" style="color:${t.runningBal>=0?'var(--accent)':'var(--error)'}">${U.fc(t.runningBal)}</td><td class="no-print text-center"><div class="flex gap-1 justify-center"><button class="btn btn-s" style="padding:3px 7px" onclick="editCB('${t.type}', ${t.id})" title="Edit"><i class="fas fa-edit" style="font-size:10px"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="delCB('${t.type}', ${t.id})" title="Delete"><i class="fas fa-trash" style="font-size:10px"></i></button></div></td></tr>`).join('');const closingRow=`<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">Closing Balance:</td><td class="text-right font-bold" style="color:var(--success)">${U.fc(totalDebit)}</td><td class="text-right font-bold" style="color:var(--error)">${U.fc(totalCredit)}</td><td class="text-right font-black" style="color:var(--accent)">${U.fc(closingBal)}</td><td class="no-print"></td></tr>`;const openingRow=`<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">Opening Balance:</td><td></td><td></td><td class="text-right font-bold">${U.fc(openingBal)}</td><td class="no-print"></td></tr>`;const tbodyHtml=closingRow+(rows||`<tr><td colspan="7" class="text-center py-8" style="color:var(--text2)">No transactions in this period</td></tr>`)+openingRow;document.getElementById('cb_container').innerHTML=`<div class="tw"><table><thead><tr><th>Date</th><th>Voucher</th><th>Description</th><th class="text-right">Debit</th><th class="text-right">Credit</th><th class="text-right">Balance</th><th class="no-print text-center">Actions</th></tr></thead><tbody>${tbodyHtml}</tbody></table></div>`};
window.editCB=function(type,id){if(type==='cr')showCRF(id);else if(type==='cp')showCPF(id);else if(type==='exp')showEXF(id);else if(type==='pay')showLPF(id)};
window.delCB=function(type,id){cfm('Delete this transaction? This will update all related ledgers.',()=>{let k='';if(type==='cr'){k='cashReceived';const cr=D.f('cashReceived',id);if(cr&&cr.ref&&cr.ref.startsWith('LOAN-')){const loanId=parseInt(cr.ref.split('-')[1]);const loan=D.f('loans',loanId);if(loan){const deductions=loan.deductions||[];const dedIdx=deductions.findIndex(d=>d.crId===id);if(dedIdx>-1){const denAmt=deductions[dedIdx].amount;deductions.splice(dedIdx,1);D.upd('loans',loanId,{deducted:(loan.deducted||0)-denAmt,deductions:deductions})}}}}else if(type==='cp')k='cashPaid';else if(type==='exp')k='expenses';else if(type==='pay'){k='payments';const p=D.f('payments',id);if(p&&p.vno.startsWith('SAL-')){const salId=parseInt(p.vno.split('-')[1]);D.upd('salaries',salId,{paid:false,paidDate:'',paidMethod:''})}}if(k){D.rm(k,id);AU.log('Delete Transaction',type+' #'+id);N.s('Transaction deleted');APP.go('cashBook')}})};
window.showCRF=function(id){const r=id?D.f('cashReceived',id):{};mdl('Cash Received Voucher',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Voucher No</label><input class="inp" id="f_crvno" value="${r.vno||U.vno('REC')}" readonly style="background:var(--card2)"></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_crd" value="${r.date||U.td()}"></div><div><label class="lbl">From *</label><input class="inp" id="f_crf" value="${r.from||''}"></div><div><label class="lbl">Amount *</label><input class="inp" type="number" id="f_cra" min="0" value="${r.am||''}"></div><div><label class="lbl">Category</label><select class="inp" id="f_crc"><option ${r.cat==='Customer Payment'?'selected':''}>Customer Payment</option><option ${r.cat==='Investment'?'selected':''}>Investment</option><option ${r.cat==='Advance Received'?'selected':''}>Advance Received</option><option ${r.cat==='Loan Received'?'selected':''}>Loan Received</option><option ${r.cat==='Loan Repayment'?'selected':''}>Loan Repayment</option><option ${r.cat==='Other'?'selected':''}>Other</option></select></div><div><label class="lbl">Method</label><select class="inp" id="f_crm"><option ${r.method==='Cash'?'selected':''}>Cash</option><option ${r.method==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${r.method==='Cheque'?'selected':''}>Cheque</option></select></div><div><label class="lbl">Reference</label><input class="inp" id="f_crr" value="${r.ref||''}"></div><div class="sm:col-span-2"><label class="lbl">Description</label><input class="inp" id="f_crdesc" value="${r.desc||''}"></div></div>`, vf('saveCR', id, 'cashReceived', 'showCRF'))};
window.saveCR=function(id, isNew){const d=document.getElementById('f_crd').value,f=document.getElementById('f_crf').value.trim(),a=+document.getElementById('f_cra').value;if(!d||!f||!a){N.e('Fill required fields');return}const data={date:d,vno:id?D.f('cashReceived',id).vno:U.vno('REC'),from:f,cat:document.getElementById('f_crc').value,am:a,method:document.getElementById('f_crm').value,ref:document.getElementById('f_crr').value.trim(),desc:document.getElementById('f_crdesc').value.trim()};if(id){D.upd('cashReceived',id,data)}else{D.add('cashReceived',data)}AU.log(id?'Edit Cash Received':'Add Cash Received',f+' '+U.fc(a));N.s('Saved');if(isNew){showCRF()}else{cmod();APP.go('cashBook')}};
window.showNewCashPayment=function(presetType,presetId){const pType=presetType||'Labor';mdl('New Cash Payment Voucher',`<div class="space-y-3"><div><label class="lbl">Date *</label><input class="inp" type="date" id="np_date" value="${U.td()}"></div><div><label class="lbl">Payment Type</label><select class="inp" id="np_type" onchange="togglePayType(this.value)"><option value="Labor" ${pType==='Labor'?'selected':''}>Labor Payment</option><option value="Salary" ${pType==='Salary'?'selected':''}>Salary Payment</option><option value="Expense" ${pType==='Expense'?'selected':''}>Expense Payment</option><option value="Other" ${pType==='Other'?'selected':''}>Other Payment</option></select></div><div id="np_dynamic"></div></div>`, vf('saveNewCashPayment', null));togglePayType(pType,presetId)};
window.togglePayType=function(t,presetId){const dyn=document.getElementById('np_dynamic');if(t==='Labor'){const lb=D.g('labors').filter(l=>l.status==='Active');dyn.innerHTML=`<div><label class="lbl">Labor *</label>${genCombo('np_labor', lb.map(l=>({id:l.id,name:l.name})), presetId, ()=>updateLaborOut(document.getElementById('np_labor').value))}</div><div id="np_out" class="text-xs p-2 mt-2" style="background:var(--card2);border-radius:6px">Outstanding: 0</div><div class="mt-2"><label class="lbl">Amount *</label><input class="inp" type="number" id="np_amt"></div><div><label class="lbl">Remarks</label><input class="inp" id="np_rem"></div>`;if(presetId)updateLaborOut(presetId)}else if(t==='Salary'){const ym=U.ms().slice(0,7);const unpaid=D.g('salaries').filter(s=>s.month===ym&&!s.paid);dyn.innerHTML=`<div><label class="lbl">Month</label><input class="inp" type="month" id="np_month" value="${ym}" onchange="updateSalaryOut(this.value)"></div><div class="mt-2"><label class="lbl">Employee *</label>${genCombo('np_emp', unpaid.map(s=>({id:s.lid,name:U.ln(s.lid)+' (Net: '+U.fc(s.netSalary)+')'})), null, ()=>updateSalaryAmount(document.getElementById('np_emp').value, document.getElementById('np_month').value))}</div><div id="np_sals" class="text-xs p-2 mt-2" style="background:var(--card2);border-radius:6px">Salary Payable: 0</div><div class="mt-2"><label class="lbl">Amount *</label><input class="inp" type="number" id="np_amt"></div><div><label class="lbl">Remarks</label><input class="inp" id="np_rem" value="Monthly Salary"></div>`}else if(t==='Expense'){const ec=D.g('expCats');dyn.innerHTML=`<div><label class="lbl">Category *</label>${genCombo('np_cat', ec.map(c=>({id:c.id,name:c.name})), null)}</div><div class="mt-2"><label class="lbl">Payee (To) *</label><input class="inp" id="np_to"></div><div class="mt-2"><label class="lbl">Amount *</label><input class="inp" type="number" id="np_amt"></div><div><label class="lbl">Description</label><input class="inp" id="np_desc"></div>`}else if(t==='Other'){dyn.innerHTML=`<div><label class="lbl">Payee (To) *</label><input class="inp" id="np_to"></div><div class="mt-2"><label class="lbl">Category</label><input class="inp" id="np_cat" value="Other"></div><div class="mt-2"><label class="lbl">Amount *</label><input class="inp" type="number" id="np_amt"></div><div><label class="lbl">Description</label><input class="inp" id="np_desc"></div>`}};
window.updateLaborOut=function(lid){const out=U.earn(lid)+U.overtime(lid)-U.paid(lid);document.getElementById('np_out').innerHTML=`Total Outstanding: <strong style="color:var(--error)">${U.fc(out)}</strong>`};
window.updateSalaryOut=function(ym){const unpaid=D.g('salaries').filter(s=>s.month===ym&&!s.paid);const empSel=document.getElementById('np_emp');if(empSel){const parent=empSel.closest('.combo');if(parent)parent.remove();}const dyn=document.getElementById('np_dynamic');let html=`<div><label class="lbl">Month</label><input class="inp" type="month" id="np_month" value="${ym}" onchange="updateSalaryOut(this.value)"></div><div class="mt-2"><label class="lbl">Employee *</label>${genCombo('np_emp', unpaid.map(s=>({id:s.lid,name:U.ln(s.lid)+' (Net: '+U.fc(s.netSalary)+')'})), null, ()=>updateSalaryAmount(document.getElementById('np_emp').value, document.getElementById('np_month').value))}</div><div id="np_sals" class="text-xs p-2 mt-2" style="background:var(--card2);border-radius:6px">Salary Payable: 0</div><div class="mt-2"><label class="lbl">Amount *</label><input class="inp" type="number" id="np_amt"></div><div><label class="lbl">Remarks</label><input class="inp" id="np_rem" value="Monthly Salary"></div>`;dyn.innerHTML=html};
window.updateSalaryAmount=function(lid,ym){const sal=D.g('salaries').find(s=>s.lid==lid&&s.month==ym);if(sal){document.getElementById('np_sals').innerHTML=`Salary Payable: <strong style="color:var(--error)">${U.fc(sal.netSalary)}</strong>`;document.getElementById('np_amt').value=sal.netSalary}};
window.saveNewCashPayment=function(isNew){const t=document.getElementById('np_type').value;const d=document.getElementById('np_date').value;if(!d){N.e('Date required');return}if(t==='Labor'){const lid=+document.getElementById('np_labor').value;const am=+document.getElementById('np_amt').value;if(!lid||!am){N.e('Fill required fields');return}D.add('payments',{date:d,vno:U.vno('PAY'),lid,am,method:'Cash',rem:document.getElementById('np_rem').value||'Labor Payment'});AU.log('Add Labor Payment',U.ln(lid)+' '+U.fc(am))}else if(t==='Salary'){const ym=document.getElementById('np_month').value;const lid=+document.getElementById('np_emp').value;const am=+document.getElementById('np_amt').value;const sal=D.g('salaries').find(s=>s.lid===lid&&s.month===ym);if(!sal){N.e('Salary not found');return}if(!lid||!am){N.e('Fill required fields');return}D.add('payments',{date:d,vno:'SAL-'+sal.id,lid,am,method:'Cash',rem:'Monthly salary '+ym});D.upd('salaries',sal.id,{paid:true,paidDate:d,paidMethod:'Cash'});AU.log('Pay Salary',U.ln(lid)+' '+U.fc(am))}else if(t==='Expense'){const cid=+document.getElementById('np_cat').value;const to=document.getElementById('np_to').value.trim();const am=+document.getElementById('np_amt').value;if(!to||!am){N.e('Fill required fields');return}D.add('expenses',{date:d,vno:U.vno('EXP'),cid,to,am,method:'Cash',desc:document.getElementById('np_desc').value});AU.log('Add Expense',U.cn(cid)+' '+U.fc(am))}else if(t==='Other'){const to=document.getElementById('np_to').value.trim();const am=+document.getElementById('np_amt').value;if(!to||!am){N.e('Fill required fields');return}D.add('cashPaid',{date:d,vno:U.vno('CPAY'),to,cat:document.getElementById('np_cat').value||'Other',am,method:'Cash',desc:document.getElementById('np_desc').value});AU.log('Add Cash Payment',to+' '+U.fc(am))}N.s('Payment Saved');if(isNew){showNewCashPayment(document.getElementById('np_type').value)}else{cmod();APP.go('cashBook')}};
window.showLPF=function(id){const p=id?D.f('payments',id):{};const lb=D.g('labors').filter(l=>l.status==='Active');mdl('Labor/Salary Payment Voucher',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Voucher No</label><input class="inp" id="f_pavno" value="${p.vno||U.vno('PAY')}" readonly style="background:var(--card2)"></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_pd" value="${p.date||U.td()}"></div><div><label class="lbl">Labor *</label>${genCombo('f_pl', lb.map(l=>({id:l.id,name:l.name})), p.lid)}</div><div><label class="lbl">Amount *</label><input class="inp" type="number" id="f_pa" min="0" value="${p.am||''}"></div><div><label class="lbl">Method</label><select class="inp" id="f_pm"><option ${p.method==='Cash'?'selected':''}>Cash</option><option ${p.method==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${p.method==='Cheque'?'selected':''}>Cheque</option></select></div><div class="sm:col-span-2"><label class="lbl">Remarks</label><input class="inp" id="f_pr" value="${p.rem||''}"></div></div>`, vf('saveLPF', id, 'payments', 'showLPF'))};
window.saveLPF=function(id, isNew){const d=document.getElementById('f_pd').value,lid=+document.getElementById('f_pl').value,am=+document.getElementById('f_pa').value;if(!d||!lid||!am){N.e('Fill required fields');return}const old=id?D.f('payments',id):null;const data={date:d,vno:id?old.vno:U.vno('PAY'),lid,am,method:document.getElementById('f_pm').value,rem:document.getElementById('f_pr').value.trim()};if(id){D.upd('payments',id,data)}else{D.add('payments',data)}AU.log(id?'Edit Payment':'Add Payment',U.ln(lid)+' '+U.fc(am));N.s('Saved');if(isNew){showLPF()}else{cmod();APP.go('cashBook')}};
window.showEXF=function(id){const e=id?D.f('expenses',id):{};const ec=D.g('expCats');mdl('Expense Voucher',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Voucher No</label><input class="inp" id="f_exvno" value="${e.vno||U.vno('EXP')}" readonly style="background:var(--card2)"></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_exd" value="${e.date||U.td()}"></div><div><label class="lbl">Category *</label>${genCombo('f_exc', ec.map(c=>({id:c.id,name:c.name})), e.cid)}</div><div><label class="lbl">To *</label><input class="inp" id="f_ext" value="${e.to||''}"></div><div><label class="lbl">Amount *</label><input class="inp" type="number" id="f_exa" min="0" value="${e.am||''}"></div><div><label class="lbl">Method</label><select class="inp" id="f_exm"><option ${e.method==='Cash'?'selected':''}>Cash</option><option ${e.method==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${e.method==='Cheque'?'selected':''}>Cheque</option></select></div><div class="sm:col-span-2"><label class="lbl">Description</label><input class="inp" id="f_exdesc" value="${e.desc||''}"></div></div>`, vf('saveEX', id, 'expenses', 'showEXF'))};
window.saveEX=function(id, isNew){const d=document.getElementById('f_exd').value,cid=+document.getElementById('f_exc').value,t=document.getElementById('f_ext').value.trim(),a=+document.getElementById('f_exa').value;if(!d||!t||!a){N.e('Fill required fields');return}const data={date:d,vno:id?D.f('expenses',id).vno:U.vno('EXP'),cid,to:t,am:a,method:document.getElementById('f_exm').value,desc:document.getElementById('f_exdesc').value.trim()};if(id){D.upd('expenses',id,data)}else{D.add('expenses',data)}AU.log(id?'Edit Expense':'Add Expense',U.cn(cid)+' '+U.fc(a));N.s('Saved');if(isNew){showEXF()}else{cmod();APP.go('cashBook')}};
window.showCPF=function(id){const p=id?D.f('cashPaid',id):{};mdl('Cash Payment Voucher (Other)',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="lbl">Voucher No</label><input class="inp" id="f_cpvno" value="${p.vno||U.vno('CPAY')}" readonly style="background:var(--card2)"></div><div><label class="lbl">Date *</label><input class="inp" type="date" id="f_cpd" value="${p.date||U.td()}"></div><div><label class="lbl">To *</label><input class="inp" id="f_cpt" value="${p.to||''}"></div><div><label class="lbl">Amount *</label><input class="inp" type="number" id="f_cpa" min="0" value="${p.am||''}"></div><div><label class="lbl">Category</label><select class="inp" id="f_cpc"><option ${p.cat==='Supplier Payment'?'selected':''}>Supplier Payment</option><option ${p.cat==='Maintenance'?'selected':''}>Maintenance</option><option ${p.cat==='Utilities'?'selected':''}>Utilities</option><option ${p.cat==='Transport'?'selected':''}>Transport</option><option ${p.cat==='Other'?'selected':''}>Other</option></select></div><div><label class="lbl">Method</label><select class="inp" id="f_cpm"><option ${p.method==='Cash'?'selected':''}>Cash</option><option ${p.method==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${p.method==='Cheque'?'selected':''}>Cheque</option></select></div><div class="sm:col-span-2"><label class="lbl">Description</label><input class="inp" id="f_cpdesc" value="${p.desc||''}"></div></div>`, vf('saveCP', id, 'cashPaid', 'showCPF'))};
window.saveCP=function(id, isNew){const d=document.getElementById('f_cpd').value,t=document.getElementById('f_cpt').value.trim(),a=+document.getElementById('f_cpa').value;if(!d||!t||!a){N.e('Fill required fields');return}const data={date:d,vno:id?D.f('cashPaid',id).vno:U.vno('CPAY'),to:t,cat:document.getElementById('f_cpc').value,am:a,method:document.getElementById('f_cpm').value,desc:document.getElementById('f_cpdesc').value.trim()};if(id){D.upd('cashPaid',id,data)}else{D.add('cashPaid',data)}AU.log(id?'Edit Cash Payment':'Add Cash Payment',t+' '+U.fc(a));N.s('Saved');if(isNew){showCPF()}else{cmod();APP.go('cashBook')}};

PG.laborPayables=function(){return `<div class="flex items-center justify-between mb-4"><div><h1 class="text-xl font-black"><i class="fas fa-file-invoice-dollar mr-2" style="color:var(--accent)"></i>Labor Payables</h1><p class="text-xs" style="color:var(--text2)">Outstanding balances for daily work & monthly salaries</p></div><div class="flex gap-2 no-print"><button class="btn btn-s" onclick="expPayables()"><i class="fas fa-download"></i> Export</button><button class="btn btn-p" onclick="printPayables()"><i class="fas fa-print"></i> Print Summary</button></div></div><div class="flex gap-2 mb-4 flex-wrap no-print"><button class="tab-b a" id="ptab_work" onclick="switchPayablesTab('work')"><i class="fas fa-clipboard-list mr-1"></i> Work Payables</button><button class="tab-b" id="ptab_salary" onclick="switchPayablesTab('salary')"><i class="fas fa-money-bill-wave mr-1"></i> Salary Payables</button></div><div id="payables_content"></div>`};

window.switchPayablesTab=function(t){payablesTab=t;document.getElementById('ptab_work').classList.toggle('a',t==='work');document.getElementById('ptab_salary').classList.toggle('a',t==='salary');renderPayables()};
window.renderPayables=function(){const lb=D.g('labors');const cont=document.getElementById('payables_content');let html='';if(payablesTab==='work'){const rows=lb.map(l=>{const e=U.earn(l.id)+U.overtime(l.id);const p=U.paid(l.id);return{l,bal:e-p,e,p}}).filter(r=>r.bal>0).sort((a,b)=>b.bal-a.bal);const total=rows.reduce((s,r)=>s+r.bal,0);html=`<div class="tw"><table><thead><tr><th>#</th><th>Labor</th><th>Department</th><th>Total Earned</th><th>Total Paid</th><th>Balance Due</th><th class="no-print">Action</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td class="text-xs">${i+1}</td><td class="font-semibold">${r.l.name}</td><td class="text-xs"><span class="badge bg-i">${r.l.dept||'-'}</span></td><td style="color:var(--success)">${U.fc(r.e)}</td><td style="color:var(--error)">${U.fc(r.p)}</td><td class="font-bold" style="color:var(--accent)">${U.fc(r.bal)}</td><td class="no-print"><button class="btn btn-p" style="padding:3px 10px;font-size:11px" onclick="showNewCashPayment('Labor', ${r.l.id})">Pay</button></td></tr>`).join(''):'<tr><td colspan="7" class="text-center py-8" style="color:var(--text2)"><i class="fas fa-check-circle text-2xl mb-2 block" style="color:var(--success)"></i>All clear! No work payables.</td></tr>'}${rows.length?`<tr style="background:var(--card2)"><td colspan="5" class="text-right font-bold">Total Outstanding:</td><td class="font-black" style="color:var(--accent)">${U.fc(total)}</td><td class="no-print"></td></tr>`:''}</tbody></table></div>`}else if(payablesTab==='salary'){const rows=lb.map(l=>{const unpaidSals=D.g('salaries').filter(s=>s.lid===l.id&&!s.paid);const totalUnpaid=unpaidSals.reduce((sum,s)=>sum+s.netSalary,0);return{l,unpaidSals,totalUnpaid}}).filter(r=>r.totalUnpaid>0).sort((a,b)=>b.totalUnpaid-a.totalUnpaid);const total=rows.reduce((s,r)=>s+r.totalUnpaid,0);html=`<div class="tw"><table><thead><tr><th>#</th><th>Labor</th><th>Department</th><th>Unpaid Months</th><th>Total Unpaid Salary</th><th class="no-print">Action</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td class="text-xs">${i+1}</td><td class="font-semibold">${r.l.name}</td><td class="text-xs"><span class="badge bg-i">${r.l.dept||'-'}</span></td><td class="text-xs"><span class="badge bg-w">${r.unpaidSals.length}</span> <span style="color:var(--text2)">(${r.unpaidSals.map(s=>s.month).join(', ')})</span></td><td class="font-bold" style="color:var(--accent)">${U.fc(r.totalUnpaid)}</td><td class="no-print"><button class="btn btn-p" style="padding:3px 10px;font-size:11px" onclick="APP.go('monthlySalary')">Pay</button></td></tr>`).join(''):'<tr><td colspan="6" class="text-center py-8" style="color:var(--text2)"><i class="fas fa-check-circle text-2xl mb-2 block" style="color:var(--success)"></i>All clear! No salary payables.</td></tr>'}${rows.length?`<tr style="background:var(--card2)"><td colspan="4" class="text-right font-bold">Total Outstanding Salaries:</td><td class="font-black" style="color:var(--accent)">${U.fc(total)}</td><td class="no-print"></td></tr>`:''}</tbody></table></div>`}cont.innerHTML=html};
window.expPayables=function(){const lb=D.g('labors');let h,rows;if(payablesTab==='work'){const data=lb.map(l=>{const e=U.earn(l.id)+U.overtime(l.id),p=U.paid(l.id);return{l,bal:e-p,e,p}}).filter(r=>r.bal>0).sort((a,b)=>b.bal-a.bal);if(!data.length){N.w('No work payables');return}h=['Labor','Department','Total Earned','Total Paid','Balance Due'];rows=data.map(r=>[r.l.name,r.l.dept||'',r.e,r.p,r.bal]);U.csv('Work_Payables.csv',h,rows)}else{const data=lb.map(l=>{const u=D.g('salaries').filter(s=>s.lid===l.id&&!s.paid);return{l,u,tot:u.reduce((s,x)=>s+x.netSalary,0)}}).filter(r=>r.tot>0).sort((a,b)=>b.tot-a.tot);if(!data.length){N.w('No salary payables');return}h=['Labor','Department','Unpaid Months','Total Unpaid Salary'];rows=data.map(r=>[r.l.name,r.l.dept||'',r.u.map(s=>s.month).join(', '),r.tot]);U.csv('Salary_Payables.csv',h,rows)}N.s('Payables exported')};

PG.wageSlip=function(){const lb=D.g('labors'),ym=U.ms().slice(0,7);return`<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-black">Wage Slip</h1></div><div class="flex gap-2 no-print flex-wrap items-end"><div><label class="lbl">Labor</label>${genCombo('wsl', lb.map(l=>({id:l.id,name:l.name})), null)}</div><div><label class="lbl">From Date</label><input class="inp" type="date" id="wsl_from" value="${ym}-01" style="font-size:11.5px;width:140px"></div><div><label class="lbl">To Date</label><input class="inp" type="date" id="wsl_to" value="${U.td()}" style="font-size:11.5px;width:140px"></div><button class="btn btn-p" onclick="genWS()"><i class="fas fa-sync-alt"></i> Generate</button></div></div><div id="wsc"><div class="empty"><i class="fas fa-file-alt"></i><p>Select labor and date range to generate wage slip</p></div></div>`};
window.genWS=function(){const lid=+document.getElementById('wsl').value,from=document.getElementById('wsl_from').value,to=document.getElementById('wsl_to').value;if(!lid){N.e('Select labor');return}if(!from||!to){N.e('Select date range');return}const dayBeforeFrom=new Date(new Date(from).getTime()-86400000).toISOString().split('T')[0];const prevEarn=U.earn(lid,null,dayBeforeFrom),prevPaid=U.paid(lid,null,dayBeforeFrom),prevBal=prevEarn-prevPaid;const l=D.f('labors',lid),we=D.g('workEntries').filter(e=>e.lid===lid&&e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date)),py=D.g('payments').filter(e=>e.lid===lid&&e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date));const currEarn=we.reduce((s,e)=>s+e.amt,0),currOT=U.overtime(lid,from,to),currPaid=py.reduce((s,e)=>s+e.am,0),loanOut=U.loanOutstanding(lid),closingBal=prevBal+currEarn+currOT-currPaid,st=D.go('settings');const totalQty=we.reduce((s,e)=>s+e.qty,0);document.getElementById('wsc').innerHTML=`<div class="card" style="max-width:800px"><div class="text-center pb-4 mb-4" style="border-bottom:2px solid var(--border)"><h2 class="font-black text-lg">${st.companyName||'Company'}</h2><p class="text-xs" style="color:var(--text2)">${st.address||''}</p><p class="text-xs" style="color:var(--text2)">Phone: ${st.phone||''} | Email: ${st.email||''}</p></div><div class="text-center mb-4"><span class="badge bg-a" style="font-size:14px;padding:6px 20px">WAGE SLIP</span></div><div class="grid grid-cols-2 gap-3 text-sm mb-4"><div><span style="color:var(--text2)">Labor Name:</span> <strong>${l.name}</strong></div><div><span style="color:var(--text2)">Period:</span> ${U.fd(from)} to ${U.fd(to)}</div></div><div class="tw mb-4"><table><thead><tr><th>Date</th><th>Item</th><th>Service</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${we.length?we.map(e=>`<tr><td class="text-xs">${U.fd(e.date)}</td><td>${U.in(e.iid)}</td><td>${U.sn(e.sid)}</td><td class="text-center">${e.qty}</td><td class="text-right">${U.fc(e.rate)}</td><td class="text-right text-xs font-bold">${U.fc(e.amt)}</td></tr>`).join(''):'<tr><td colspan="6" class="text-center">No work entries</td></tr>'}<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">Total Period Qty: ${U.fm(totalQty)}</td><td colspan="2" class="text-right font-bold">Total Earnings:</td><td class="text-right font-black" style="color:var(--success)">${U.fc(currEarn)}</td></tr></tbody></table></div><div class="tw mb-4"><table><thead><tr><th>Date</th><th>Description</th><th>Remarks</th><th>Amount</th></tr></thead><tbody>${py.length?py.map(p=>`<tr><td class="text-xs">${U.fd(p.date)}</td><td class="text-xs">${p.method||'Payment'}</td><td class="text-xs">${p.rem||''}</td><td class="text-right text-xs font-bold" style="color:var(--error)">-${U.fc(p.am)}</td></tr>`).join(''):'<tr><td colspan="4" class="text-center">No payments</td></tr>'}<tr style="background:var(--card2)"><td colspan="3" class="text-right font-bold">Current Period Payments:</td><td class="text-right font-black" style="color:var(--error)">-${U.fc(currPaid)}</td></tr></tbody></table></div><div class="p-4 rounded-lg" style="background:var(--card2);border:1px solid var(--border)"><div class="flex justify-between mb-2"><span class="text-sm">Opening Balance:</span><span class="font-bold">${U.fc(prevBal)}</span></div><div class="flex justify-between mb-2"><span class="text-sm">Current Earnings (+):</span><span class="font-bold" style="color:var(--success)">${U.fc(currEarn)}</span></div><div class="flex justify-between mb-2"><span class="text-sm">Overtime Earnings (+):</span><span class="font-bold" style="color:var(--warn)">${U.fc(currOT)}</span></div><div class="flex justify-between mb-2"><span class="text-sm">Current Payments (-):</span><span class="font-bold" style="color:var(--error)">-${U.fc(currPaid)}</span></div><div class="flex justify-between mb-2"><span class="text-sm">Long-Term Loan Outstanding (Memo):</span><span class="font-bold" style="color:var(--warn)">${U.fc(loanOut)}</span></div><div class="flex justify-between items-center pt-2 mt-2" style="border-top:1px solid var(--border)"><span class="font-bold">Closing Balance Due:</span><span class="text-xl font-black" style="color:${closingBal>=0?'var(--accent)':'var(--error)'}">${U.fc(closingBal)}</span></div></div><button class="btn btn-p w-full justify-center mt-4 no-print" onclick="printWageSlip(${lid}, '${from}', '${to}')"><i class="fas fa-print"></i> Print Wage Slip (A5)</button></div>`};
window.printWageSlip=function(lid, from, to){const dayBeforeFrom=new Date(new Date(from).getTime()-86400000).toISOString().split('T')[0];const prevEarn=U.earn(lid,null,dayBeforeFrom),prevPaid=U.paid(lid,null,dayBeforeFrom),prevBal=prevEarn-prevPaid;const l=D.f('labors',lid),we=D.g('workEntries').filter(e=>e.lid===lid&&e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date)),py=D.g('payments').filter(e=>e.lid===lid&&e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date));const currEarn=we.reduce((s,e)=>s+e.amt,0),currOT=U.overtime(lid,from,to),currPaid=py.reduce((s,e)=>s+e.am,0),loanOut=U.loanOutstanding(lid),closingBal=prevBal+currEarn+currOT-currPaid,st=D.go('settings');const totalQty=we.reduce((s,e)=>s+e.qty,0);const html=`<!DOCTYPE html><html><head><title>Wage Slip - ${l.name}</title><style>@page { size: A5 portrait; margin: 10mm; }*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;font-size:10px}body{width:100%;color:#000}.header{text-align:center;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:10px}.header h1{font-size:16px;margin-bottom:2px}.title{text-align:center;font-size:14px;font-weight:bold;margin:10px 0;background:#eee;padding:5px}.info-row{display:flex;justify-content:space-between;padding:2px 0;margin-bottom:10px}table{width:100%;border-collapse:collapse;margin-bottom:10px}th,td{border:1px solid #ccc;padding:4px;text-align:left}th{background:#f5f5f5;font-size:9px;text-transform:uppercase}.summary{background:#fff3cd;border:1px solid #ffeeba;padding:10px;border-radius:4px}.sum-row{display:flex;justify-content:space-between;padding:3px 0}.sum-bold{font-weight:bold;border-top:1px solid #333;margin-top:5px;padding-top:5px}</style></head><body><div class="header"><h1>${st.companyName||'Company'}</h1><p>${st.address||''}</p><p>Phone: ${st.phone||''} | Email: ${st.email||''}</p></div><div class="title">WAGE SLIP</div><div class="info-row"><span><strong>Labor Name:</strong> ${l.name}</span><span><strong>Period:</strong> ${U.fd(from)} to ${U.fd(to)}</span></div><table><thead><tr><th>Date</th><th>Item</th><th>Service</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${we.length?we.map(e=>`<tr><td>${U.fd(e.date)}</td><td>${U.in(e.iid)}</td><td>${U.sn(e.sid)}</td><td style="text-align:center">${e.qty}</td><td style="text-align:right">${U.fm(e.rate)}</td><td style="text-align:right">${U.fm(e.amt)}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center">No work entries</td></tr>'}<tr style="background:#f0f0f0;font-weight:bold;"><td colspan="3">Total Period Qty: ${U.fm(totalQty)}</td><td colspan="2" style="text-align:right">Total Earnings:</td><td style="text-align:right">${U.fm(currEarn)}</td></tr></tbody></table><table><thead><tr><th>Date</th><th>Description</th><th>Remarks</th><th>Amount</th></tr></thead><tbody>${py.length?py.map(p=>`<tr><td>${U.fd(p.date)}</td><td>${p.method||'Payment'}</td><td>${p.rem||''}</td><td style="text-align:right">- ${U.fm(p.am)}</td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center">No payments</td></tr>'}<tr style="background:#f0f0f0;font-weight:bold;"><td colspan="3" style="text-align:right">Current Period Payments:</td><td style="text-align:right">- ${U.fm(currPaid)}</td></tr></tbody></table><div class="summary"><div class="sum-row"><span>Opening Balance:</span> <strong>${st.curSym||'Rs.'} ${U.fm(prevBal)}</strong></div><div class="sum-row"><span>(+) Current Earnings:</span> <strong>${st.curSym||'Rs.'} ${U.fm(currEarn)}</strong></div><div class="sum-row"><span>(+) Overtime Earnings:</span> <strong>${st.curSym||'Rs.'} ${U.fm(currOT)}</strong></div><div class="sum-row"><span>(-) Current Payments:</span> <strong>${st.curSym||'Rs.'} ${U.fm(currPaid)}</strong></div><div class="sum-row"><span>Long-Term Loan Outstanding (Memo):</span> <strong>${st.curSym||'Rs.'} ${U.fm(loanOut)}</strong></div><div class="sum-row sum-bold"><span>Closing Balance Due:</span> <strong>${st.curSym||'Rs.'} ${U.fm(closingBal)}</strong></div></div></body></html>`;const w=window.open('', '_blank', 'width=600,height=800');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);}else{N.e('Please allow popups to print.');}};
