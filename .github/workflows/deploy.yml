name: Deploy LaborPro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp LaborPro.html _site/index.html
          cp cloud-sync.js payroll-fixes.js _site/
          sed -i "s|cloud-sync.js|cloud-sync.js?v=${GITHUB_SHA}|; s|payroll-fixes.js|payroll-fixes.js?v=${GITHUB_SHA}|" _site/index.html
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
